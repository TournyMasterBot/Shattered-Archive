- id: death-self
  category: death
  say: "You have been killed."
  subject: self
  actor: null
  speak: announce
  repeat: once
  status: verified
  source: recovered from the log corpus 2026-08-02
  notes: >-
    THE GAP FOUND AND FILLED. I flagged this as missing from every source and worth
    capturing; it was in the corpus all along at 345+ hits, exactly "You have been
    KILLED!!". Neither the reference doc nor any plugin carried it. It is the one
    death line that must never be missed, so unlike the third-person forms it should
    stay audible whatever else is switched off.
  patterns:
    - |-
      ^You have been KILLED!!$

- id: death-nearby
  category: death
  say: "Something died nearby."
  subject: null
  actor: null
  speak: announce
  repeat: once
  status: verified
  corpus: >-
    CORPUS-CONFIRMED 2026-08-02: 6,975 hits. The reference flagged this
    UNCONFIRMED because it was absent from DSL2's own .lua and native XML — it
    is nonetheless real and frequent.
  source: CapturedPatterns 110-112 — explicitly flagged UNCONFIRMED
  notes: >-
    Found in sibling profiles, absent from DSL2's own .lua and native XML. Adjacent
    room, so it carries no name and never will. Low value in Battle Focus (it is not
    your fight); real value in Arena, where it is the only signal a bout ended out
    of sight.
  patterns:
    - |-
      ^You hear something's death cry\.$

