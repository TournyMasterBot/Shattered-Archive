- spell: protection evil
  kind: buff
  onset: ["You feel holy and pure."]
  wearoff: ["You feel less protected."]
  status: verified
  notes: >-
    THREE-WAY WEAR-OFF COLLISION — protection evil, protection good and protection
    neutral all share the exact string "You feel less protected." The onsets are
    distinct, the wear-offs are not distinguishable at all. Announce the wear-off as
    a generic "Protection fades." rather than guessing which of the three; guessing
    is wrong two times in three. This is the one place in the table where the
    spell-name-as-utterance rule genuinely cannot be honoured.

