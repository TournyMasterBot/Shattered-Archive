- id: disarm-self-weapon
  category: disarm
  say: "You are disarmed."
  subject: self
  actor: 1
  speak: announce
  repeat: once
  status: verified
  source: CapturedPatterns 125-128; combat-compression squelchDisarmWeapon
  notes: >-
    Three wordings, one event. The optional comma in patterns 2 and 3 is deliberate —
    the reference notes PNP's source has a literal comma that looks like a typo, and
    DSL2 tolerates both. Highest-urgency line in this whole file: you are now
    swinging bare-handed and the disarm plugin's re-wield may or may not fire.
  patterns:
    - |-
      ^([\w\-\s,']+) DISARMS you and sends your weapon flying!$
    - |-
      ^([\w\-\s,']+) grabs your weapon,? and sends it flying!$
    - |-
      ^([\w\-\s,']+) controls your weapon,? and sends it flying!$

