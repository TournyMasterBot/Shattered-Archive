# Condition tiers were one giant alternation with no utterance at all, because the
# pipes consumed the column. Split per tier: each one says something different, and
# a single entry cannot carry seven different utterances. `say` is null because the
# plugin speaks these through its own deduped health-tier buckets rather than as
# per-line callouts — kept here so the mapping is documented in one place.
- id: condition-tiers
  category: condition
  say: null
  subject: null
  actor: null
  speak: suppress
  status: verified
  source: DSL2 native XML Health/Mana trigger group
  notes: >-
    Seven HP tiers, excellent → awful, plus a distinct mana tier. Self and
    third-person forms merged. Handled by SELF_CONDITION_BUCKETS /
    OPPONENT_BUCKETS, not by this map.
  patterns:
    - |-
      (?:is in excellent condition|are in excellent condition)
    - |-
      (?:has a few scratches|have a few scratches)
    - |-
      (?:has some small wounds|have some small wounds)
    - |-
      (?:has quite a few wounds|have quite a few wounds)
    - |-
      (?:has some big nasty wounds|have some big nasty wounds)
    - |-
      (?:looks pretty hurt|look pretty hurt)
    - |-
      (?:is in awful condition|are in awful condition)
    - |-
      full magical ability

