- id: rescue-other
  category: flee
  say: "{actor} rescued {subject}."
  subject: 2
  actor: 1
  speak: announce
  repeat: once
  status: verified
  source: combat-compression squelchFleeRescues (broadened form)
  notes: >-
    The reference's `rescues you!$` misses most real occurrences — the corpus shows
    third-party rescues use an identical tail ("X rescues Vsevolod!"). Split from
