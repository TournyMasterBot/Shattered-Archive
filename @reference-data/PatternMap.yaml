    person and does not belong with the done-to-you shield lines. Genuinely rare:
    7 occurrences across the whole 2.85 GB corpus, every one of this shape.
    Note the shape is "<victim> HAS <shield> knocked loose ... by <attacker>",
    which puts the item in group 2 and the attacker in group 3 — not the
    two-capture guess this entry previously carried.
  patterns:
    - |-
      ^([\w\-\s,']+) has ([\w\-\s,']+) knocked loose from their hands by ([\w\-\s,']+)!$

- id: disarm-fail
  category: disarm
  say: null
  subject: null
  actor: null
  speak: suppress
  repeat: once
  status: verified
  source: CapturedPatterns 210-211; combat-compression squelchDisarmFail (defaults squelched)
  notes: >-
    Nothing happened — same no-info rationale as Avoidance, which is why
    combat-compression defaults this one ON (squelched) while the successes default
