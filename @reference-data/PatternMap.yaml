# ═════════════════════════════════════════════════════════════════════════════
# ═════════════════════════════════════════════════════════════════════════════
# SELF-AFFECT TABLE — onset / wear-off, ~100 spells and skills
#
# DIFFERENT SHAPE ON PURPOSE. Everything above is third-person combat text where
# the work is extracting WHO. Everything below is self-side, spell-keyed, and
# already knows who: you. What it does not know is WHAT — which is exactly the
# gap you asked to close.
#
# THE UTTERANCE IS THE SPELL NAME, NOT THE ECHO.
#   "Your eyes tingle."  ->  "Detect magic."
#   "The detect magic wears off."  ->  "Detect magic fades."
# Default rule: onset says "<Spell>.", wear-off says "<Spell> fades." Optional
# `say` / `sayOff` override it where the bare name would mislead; none are needed
# yet. This is why the section is keyed on `spell` rather than `id` — the key IS
# the utterance, so a spell can never drift out of sync with what gets said.
#
# MATCHING IS LITERAL SUBSTRING, NOT REGEX — the same call stun-highlight makes,
# for the same reason: every line here is a fixed literal with nothing to capture.
# No escaping, no anchor gotchas. The four `<target>` entries are the exception
# and are marked `match: regex`.
#
# FIELDS
#   spell    the name, and the utterance
#   kind     buff     good, on you
#            debuff   bad, on you
#            utility  informational/neutral, on you (detects, size, languages)
#            offense  NOT a self affect — a line describing what YOU did to
#                     someone else. Present because the source table mixes them in.
#   onset    lines meaning it landed          (NOT `on:` — YAML 1.1 parsers read
#   wearoff  lines meaning it dropped          a bare `on`/`off` key as a boolean)
#   status / notes as above
#
# PROVENANCE FOR THE WHOLE SECTION
# CapturedPatterns 343-347: [PNP SOURCE] (DSL_PNP_Affects.echoes.lua), "NOT
# currently in DSL2's own capture layer at all". So this is real game text with no
# DSL-corpus confirmation behind it — `unverified` across the board except where a
# note says otherwise. It is also the table whose victim-side wording makes it
# useless for detecting anything landing on an ENEMY; that job stays with the
# third-person entries above.
# ═════════════════════════════════════════════════════════════════════════════

