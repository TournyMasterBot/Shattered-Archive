# ─────────────────────────────────────────────────────────────────────────────
# Game line  →  spoken utterance map
#
# WHY NOT A MARKDOWN TABLE
# GitHub-flavored markdown requires `|` to be escaped as `\|` inside a table
# cell EVEN within backticks, and regex alternation is full of them. Every
# pattern with `(You|...)` splits its row, which is what truncated "Danger Sense"
# to "Danger " and ate the whole utterance column off the condition-tier line.
#
# WHY YAML BLOCK SCALARS (`|-`)
# Everything after `|-` is literal text until the indent drops. No escaping at
# all: no `\|`, no doubled backslashes, no quote juggling — the pattern is byte
# for byte what the regex engine sees, which matters when a stray escape silently
# changes what matches. (Single-quoted YAML would work too, but these patterns are
# full of apostrophes and each one would need doubling.)
#
# WHY UTTERANCE-FIRST
# The relationship is many-to-one: several game lines collapse into one thing
# said. A pattern-per-row table forces you to repeat the utterance (your Flag rows
# repeat it twice each) and gives no home for per-utterance facts like which
# capture holds the subject. Grouping by what gets SAID puts each decision in one
# place and makes "these four lines all mean poisoned" visible at a glance.
#
# THE PAYOFF
# This is a shape a script can read, so the plugin's matcher table can be
# GENERATED from this file rather than hand-transcribed from it. Right now the
# patterns live in three places (this doc, combat-compression.plugin.ts,
# weapon-flag-squelch.plugin.ts) and drift is a matter of time. Codegen needs a
# YAML parser as a devDependency — if you would rather not add one, the same
# schema works as a .ts file with real regex literals, which also needs no
# escaping and is typechecked, just less document-like to review.
#
# ─────────────────────────────────────────────────────────────────────────────
# SCHEMA
#   id        stable key, kebab-case. Never reused for a different meaning.
#   category  debuff | stun | buff | proc | avoidance | condition | exploration
#             | death | flee | disarm | blind
#   say       what is spoken. `{subject}` and `{actor}` interpolate captures.
#   subject   1-based capture group holding WHO it happened to.
#             `self` = it happened to you (no capture needed). null = no subject.
#   actor     1-based capture group holding who did it. Usually null (unspoken).
#   speak     announce  rephrase to `say` and speak it
#             raw       speak the game's own line, unchanged
#             suppress  classify it, stay silent (noise we still want named)
#   repeat    once  fires when the effect LANDS — say it each time (default)
#             tick  re-fires every round while the effect holds — hard debounce
#                   or it becomes the only thing you hear
#   status    verified    confirmed in the real DSL log corpus
#             unverified  real game text per the reference (native XML / sibling
#                         profile), but not yet found in the DSL corpus
#             absent      searched across the FULL corpus (2,478 files, 2.85 GB)
#                         including a broadened keyword probe, and neither the
#                         line nor any related wording occurs. For a spell this
#                         usually means the logged characters never had it — it
#                         is NOT evidence the reference wording is wrong.
#             speculative extrapolated, or SEARCHED FOR AND NOT FOUND — see notes
#
# CORPUS PASS 2026-08-02 (affect table)
# All 182 affect literals were checked in one Aho-Corasick pass over every log.
# 66 of 92 spells confirmed every line they list; 8 have no trace at all; the
# rest are partial. SIX of the reference's wordings turned out to be WRONG, not
# merely unlogged — prayer ("...overtakes the room", not "your presence"), taunt
# (DOUBLE spaces before each KILL!!), charm ("<X> regains free will", no
# possessive), warcry, antimagic shell and prevent recovery (third-person forms
# the doc never carried). Those six would never have fired as written.
#   source    where the pattern came from, for auditing later
#   patterns  one or more matchers, all meaning the same utterance
#
# ANCHORING CAVEAT
# The shipping plugins match most of these UNANCHORED at the head (`is DEAD!!$`,
# not `^X is DEAD!!$`) because they only need to know the line's class. An
# utterance map needs the NAME, so entries below add `^([\w\-\s,']+) `. That head
# is an extrapolation on every pattern the reference supplied as a bare tail
# fragment — the tail is corpus-proven, the capture is not. Where that matters the
# entry says so in its notes.
# ─────────────────────────────────────────────────────────────────────────────

- id: poisoned
  category: debuff
  say: "{subject} is poisoned."
  subject: 1
  actor: null
  speak: announce
  status: verified
  repeat: once
  source: weapon-flag Poison (P) — DSL2 addition, confirmed via sibling-profile logs
  notes: >-
    The LANDING only. "shivers and suffers" used to sit here as well; it is the
    recurring tick and now lives in poison-tick, because the two want opposite
    handling — announce the landing every time, damp the tick hard.
  patterns:
    - |-
      ^([\w\-\s,']+) is poisoned by the venom on ([\w\-\s,']+)\.$

- id: lifebane-applied
  category: proc
  say: null
  subject: null
  actor: 1
  speak: suppress
  status: verified
  source: weapon-flag Poison (P); MEANING CORRECTED 2026-08-02
  notes: >-
    NOT AN AFFLICTION, and the previous reading here was backwards. This entry said
    "<weapon> coats <victim>", making group 2 the poisoned target. Real traffic —
    all 16 distinct corpus wordings — is "<player> coats <weapon> with deadly
    lifebane poison.", i.e. someone applying poison to their OWN BLADE before or
    during a fight. Group 2 is the weapon; there is no victim in the line at all.
    Recategorised from debuff to proc and switched to suppress: announcing "a grand
    arcanium dagger is poisoned." is true and useless. The actual landing on a
    target is the separate `poisoned` entry ("X is poisoned by the venom on Y").
    Dropped from the text-to-speech battle callouts for the same reason.
  patterns:
    - |-
      ^([\w\-\s,']+) coats ([\w\-\s,']+) with deadly lifebane poison\.$

