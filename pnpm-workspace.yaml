packages:
  - apps/*
  - sdks/*
  - utils/*
  - types/*
  - services/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  # Optional Node-side deps of @huggingface/transformers (game-client only
  # uses its browser/WASM path via dynamic import) — no build scripts needed.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - unrs-resolver

overrides:
  esbuild: '0.28.1'
