packages:
  - apps/*
  - sdks/*
  - utils/*
  - types/*
  - services/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  # Optional Node-side deps of @huggingface/transformers (game-client only
  # uses its browser/WASM path via dynamic import) — no build scripts needed.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - unrs-resolver

overrides:
  esbuild: '0.28.1'
  # GHSA-724g-mxrg-4qvm / CVE-2026-59870 — quadratic CPU in !!omap resolution.
  # Two ranges kept separate because consumers split across js-yaml 3.x (jest
  # toolchain) and 4.x (eslint toolchain); forcing one version would cross a major.
  js-yaml@^3.0.0: '3.15.1'
  js-yaml@^4.0.0: '4.3.1'
  # GHSA-6g55-p6wh-862q (High) + its incomplete-fix follow-up — path traversal via
  # sourceMappingURL auto-loading. 8.5.25 closes both.
  postcss: '8.5.25'
