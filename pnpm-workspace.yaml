packages:
  - apps/*
  - sdks/*
  - utils/*
  - types/*
  - services/*

# Reject package versions published less than 1 day ago (value is in MINUTES). pnpm 11 reads this setting only from
# this file: the old `minimum-dep-age` line in .npmrc is not a pnpm setting and never did anything.
minimumReleaseAge: 1440

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  # Optional deps of @vscode/vsce (dsl-color-preview's local packaging script)
  # used only for signing/publishing to the Marketplace and OS-keychain-backed
  # publisher login — neither is exercised by `vsce package --no-dependencies`,
  # which is the only vsce usage in this repo.
  '@vscode/vsce-sign': false
  esbuild: true
  keytar: false
  # Optional Node-side deps of @huggingface/transformers (game-client only
  # uses its browser/WASM path via dynamic import) — no build scripts needed.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - unrs-resolver

overrides:
  esbuild: '0.28.1'
  # GHSA-724g-mxrg-4qvm / CVE-2026-59870 — quadratic CPU in !!omap resolution.
  # Two ranges kept separate because consumers split across js-yaml 3.x (jest
  # toolchain) and 4.x (eslint toolchain); forcing one version would cross a major.
  js-yaml@^3.0.0: '3.15.1'
  js-yaml@^4.0.0: '4.3.1'
  # GHSA-6g55-p6wh-862q (High) + its incomplete-fix follow-up — path traversal via
  # sourceMappingURL auto-loading. 8.5.25 closes both.
  postcss: '8.5.25'
  # GHSA-2v37-7h3g-55p8 (High) — custom generators can loop indefinitely when
  # size is zero. Satisfies postcss's own ^3.3.16 range; dev-only (vite toolchain).
  nanoid: '3.3.18'
  # GHSA-r292-9mhp-454m (Moderate) — uncontrolled recursion in mapHas/filesFilter,
  # stack-overflow DoS via crafted long-path tar. Pulled in transitively by
  # onnxruntime-node (optional Node-side dep of @huggingface/transformers; unused
  # here — game-client only uses the browser/WASM path).
  tar: '7.5.22'
  # GHSA-f88m-g3jw-g9cj (High) — inherited libvips CVEs (CVE-2026-33327/28,
  # CVE-2026-35590/91). Fix is 0.35.0+, which crosses @huggingface/transformers'
  # declared range (^0.34.5, still true as of its latest 4.2.0 — no in-range patch
  # exists). Forced anyway: sharp's build script is disabled here (see allowBuilds
  # above) since game-client only uses transformers' browser/WASM path, not the
  # Node/sharp path, so this is untested-by-upstream but effectively dormant.
  sharp: '0.35.3'
  # Dependabot / GHSA — Handlebars.compile()/precompile() code injection via a crafted
  # pre-parsed AST (bypasses the 4.7.9 validator). 4.7.10 closes it. Pulled in only by
  # ts-jest (29.4.11 declares ^4.7.9, so 4.7.10 is in range); dev-only, we never pass an object to compile().
  handlebars: '4.7.10'
  # Dependabot #118 / GHSA — quote() command injection via a line terminator in a token
  # after a { comment } token (affects >= 1.8.4, < 1.11.0). Pulled in only by
  # concurrently 9.2.4 (root dev scripts), which declares ^1.9.0, so 1.11.0 is in range.
  # We never call quote() on untrusted input.
  shell-quote: '1.11.0'
  # Dependabot #119 / GHSA — IP spoofing via an IPv4-mapped IPv6 trust subnet with a short
  # prefix (affects >= 1.1.0, < 2.0.8). Pulled in only by express 5, which declares ^2.0.7,
  # so 2.0.8 is in range. Fixed by the override rather than waiting on an express bump.
  proxy-addr: '2.0.8'
