name: CI - Test & Coverage

on:
  pull_request:
    branches: [ release/dev, release/staging, release/production ]
  push:
    branches: [ release/dev, release/staging, release/production ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use Corepack + packageManager from package.json as the single source of truth.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Run Jest tests with coverage
        run: pnpm test -- --coverage

      - name: Merge workspace coverage summaries
        if: always()
        run: node scripts/merge-coverage-summary.cjs

      - name: Add coverage summary to run
        if: always()
        shell: bash
        run: |
          echo "### Test & Coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const fs=require('fs'); const p='coverage/coverage-summary.json'; const s=JSON.parse(fs.readFileSync(p,'utf8')).total; const fmt=v=>\`\${((v.pct??0)).toFixed(2)}%\`; const lines=['','| Metric | % | Covered / Total |','|---|---:|---:|',\`| Lines | \${fmt(s.lines)} | \${s.lines.covered}/\${s.lines.total} |\`,\`| Statements | \${fmt(s.statements)} | \${s.statements.covered}/\${s.statements.total} |\`,\`| Functions | \${fmt(s.functions)} | \${s.functions.covered}/\${s.functions.total} |\`,\`| Branches | \${fmt(s.branches)} | \${s.branches.covered}/\${s.branches.total} |\`]; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage/coverage-summary.json found. Check Jest coverageDirectory/output paths." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            **/coverage/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-summary-path: coverage/coverage-summary.json
          unique-id-for-comment: ci-test-coverage
          create-new-comment: false
          hide-comment: false
