name: CI - Test & Coverage

on:
  pull_request:
    branches: [ release/dev, release/staging, release/production ]
  push:
    branches: [ release/dev, release/staging, release/production ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Jest (root) with coverage
        env:
          CI: "true"
        run: pnpm exec jest --config ./jest.config.cjs --runInBand --coverage --coverageReporters=json --coverageReporters=json-summary

      - name: Split coverage-final.json into per-workspace summaries
        if: always()
        run: node scripts/split-coverage-final.cjs

      - name: Add per-project coverage table to run
        if: always()
        shell: bash
        run: |
          if [ ! -f coverage/workspaces/index.json ]; then
            echo "No per-project index found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');

          const idx = JSON.parse(fs.readFileSync('coverage/workspaces/index.json','utf8'));

          const fmtPct = (v) => `${Number(v?.pct ?? 0).toFixed(2)}%`;
          const fmtRatio = (v) => `${v?.covered ?? 0}/${v?.total ?? 0}`;

          let out = [];
          out.push('\n### Test & Coverage (Per Project Bucket)');
          out.push('\n| Bucket | Lines | Statements | Functions | Branches |');
          out.push('|---|---:|---:|---:|---:|');

          for (const e of idx) {
            const s = JSON.parse(fs.readFileSync(e.path, 'utf8')).total;

            const cell = (m) => `${fmtPct(m)} (${fmtRatio(m)})`;

            out.push(`| ${e.bucket} | ${cell(s.lines)} | ${cell(s.statements)} | ${cell(s.functions)} | ${cell(s.branches)} |`);
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          NODE

      - name: Build multiple-files list for PR comment
        if: always()
        id: covlist
        shell: bash
        run: |
          set -euo pipefail
          list="$(node scripts/list-coverage-summaries.cjs 2>/dev/null || true)"

          # Encode newlines for GITHUB_OUTPUT
          esc="${list//'%'/'%25'}"
          esc="${esc//$'\n'/'%0A'}"
          esc="${esc//$'\r'/'%0D'}"

          echo "multiple_files=$esc" >> "$GITHUB_OUTPUT"
          echo "has_multiple=$([ -n "$list" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Add overall coverage summary to run
        if: always()
        shell: bash
        run: |
          echo "### Test & Coverage (Overall)" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f coverage/coverage-summary.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage/coverage-summary.json found. Check split-coverage-final step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');

          const p = 'coverage/coverage-summary.json';
          const s = JSON.parse(fs.readFileSync(p, 'utf8')).total;

          const fmtPct = (v) => `${Number(v?.pct ?? 0).toFixed(2)}%`;
          const fmtRatio = (v) => `${v?.covered ?? 0}/${v?.total ?? 0}`;

          const lines = [
            '',
            '| Metric | % | Covered / Total |',
            '|---|---:|---:|',
            `| Lines | ${fmtPct(s.lines)} | ${fmtRatio(s.lines)} |`,
            `| Statements | ${fmtPct(s.statements)} | ${fmtRatio(s.statements)} |`,
            `| Functions | ${fmtPct(s.functions)} | ${fmtRatio(s.functions)} |`,
            `| Branches | ${fmtPct(s.branches)} | ${fmtRatio(s.branches)} |`,
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/
            **/coverage/

      - name: Comment coverage on PR (overall + per project)
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          unique-id-for-comment: ci-test-coverage
          create-new-comment: false
          hide-comment: false
          coverage-summary-path: coverage/coverage-summary.json
          multiple-files: ${{ steps.covlist.outputs.has_multiple == 'true' && steps.covlist.outputs.multiple_files || '' }}
