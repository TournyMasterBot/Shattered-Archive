name: CI - Test & Coverage

on:
  pull_request:
    branches: [ release/dev, release/staging, release/production ]
  push:
    branches: [ release/dev, release/staging, release/production ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      # Run ONCE from repo root so the jest.config.cjs patterns make sense
      - name: Run Jest (root) with coverage
        env:
          CI: "true"
        run: pnpm test:coverage

      - name: Build coverage file list (monorepo)
        if: always()
        id: covlist
        shell: bash
        run: |
          echo "multiple_files<<EOF" >> "$GITHUB_OUTPUT"
          node scripts/list-coverage-summaries.cjs >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Merge workspace coverage summaries (overall)
        if: always()
        run: node scripts/merge-coverage-summary.cjs

      - name: Add overall coverage summary to run
        if: always()
        shell: bash
        run: |
          echo "### Test & Coverage (Overall)" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f coverage/coverage-summary.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage/coverage-summary.json found (overall). Check merge script output." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > /tmp/write-coverage-summary.mjs <<'EOF'
          import fs from 'fs';

          const p = 'coverage/coverage-summary.json';
          const s = JSON.parse(fs.readFileSync(p, 'utf8')).total;

          const fmt = (v) => `${Number(v?.pct ?? 0).toFixed(2)}%`;

          const lines = [
            '',
            '| Metric | % | Covered / Total |',
            '|---|---:|---:|',
            `| Lines | ${fmt(s.lines)} | ${s.lines.covered}/${s.lines.total} |`,
            `| Statements | ${fmt(s.statements)} | ${s.statements.covered}/${s.statements.total} |`,
            `| Functions | ${fmt(s.functions)} | ${s.functions.covered}/${s.functions.total} |`,
            `| Branches | ${fmt(s.branches)} | ${s.branches.covered}/${s.branches.total} |`,
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          EOF

          node /tmp/write-coverage-summary.mjs

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            **/coverage/

      - name: Comment coverage on PR (per workspace)
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          unique-id-for-comment: ci-test-coverage
          create-new-comment: false
          hide-comment: false
          multiple-files: ${{ steps.covlist.outputs.multiple_files }}
