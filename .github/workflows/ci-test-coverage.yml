name: CI - Test & Coverage

on:
  pull_request:
    branches: [ release/dev, release/staging, release/production ]
  push:
    branches: [ release/dev, release/staging, release/production ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Run Jest (root) with coverage
        env:
          CI: "true"
        run: pnpm exec jest --config ./jest.config.cjs --runInBand --coverage --coverageReporters=json --coverageReporters=json-summary

      - name: Split coverage-final.json into per-workspace summaries
        if: always()
        run: node scripts/split-coverage-final.cjs

      - name: Build multiple-files list for PR comment
        if: always()
        id: covlist
        shell: bash
        run: |
          tmp="$(mktemp)"

          if node scripts/list-coverage-summaries.cjs > "$tmp"; then
            :
          else
            echo "No coverage summaries found (continuing)." >&2
            : > "$tmp"
          fi

          {
            echo "multiple_files<<EOF"
            cat "$tmp"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add overall coverage summary to run
        if: always()
        shell: bash
        run: |
          echo "### Test & Coverage (Overall)" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f coverage/coverage-summary.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage/coverage-summary.json found. Check split-coverage-final step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');

          const p = 'coverage/coverage-summary.json';
          const s = JSON.parse(fs.readFileSync(p, 'utf8')).total;

          const fmtPct = (v) => `${Number(v?.pct ?? 0).toFixed(2)}%`;
          const fmtRatio = (v) => `${v?.covered ?? 0}/${v?.total ?? 0}`;

          const lines = [
            '',
            '| Metric | % | Covered / Total |',
            '|---|---:|---:|',
            `| Lines | ${fmtPct(s.lines)} | ${fmtRatio(s.lines)} |`,
            `| Statements | ${fmtPct(s.statements)} | ${fmtRatio(s.statements)} |`,
            `| Functions | ${fmtPct(s.functions)} | ${fmtRatio(s.functions)} |`,
            `| Branches | ${fmtPct(s.branches)} | ${fmtRatio(s.branches)} |`,
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            **/coverage/

      - name: Comment coverage on PR (per workspace)
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          unique-id-for-comment: ci-test-coverage
          create-new-comment: false
          hide-comment: false
          coverage-summary-path: coverage/coverage-summary.json
          multiple-files: ${{ steps.covlist.outputs.multiple_files }}
