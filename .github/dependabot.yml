version: 2
updates:
  # GitHub Actions (group minor/patch together)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gha-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm / pnpm (monorepo) — group minor/patch together across all workspace dirs
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/game-client"
      - "/apps/game-server"
      - "/apps/web-client"
      - "/apps/web-server"
      - "/sdks/sdks-client"
      - "/sdks/sdks-server"
      - "/services/services-client"
      - "/services/services-server"
      - "/types/types-client"
      - "/types/types-global"
      - "/types/types-server"
      - "/utils/utils-client"
      - "/utils/utils-global"
      - "/utils/utils-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
