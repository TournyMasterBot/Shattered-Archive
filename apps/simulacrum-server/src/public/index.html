<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Simulacrum access</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --surface: #151821;
    --border: #2a2f45;
    --text: #e6e6e6;
    --text-muted: #9aa0b4;
    --accent: #9ecbff;
    --error: #e08a8a;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu,
      'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 32rem;
    margin: 4rem auto;
    padding: 0 1.25rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1 { font-size: 1.4rem; letter-spacing: -0.01em; margin-bottom: 0.9rem; }
  p { color: var(--text-muted); }

  #status { margin: 1.75rem 0 1rem; color: var(--text); }
  .muted { color: var(--text-muted); font-size: 0.9rem; }

  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 1.1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.7rem 0.9rem;
    border-radius: var(--radius-sm);
    word-break: break-all;
    user-select: all;
  }

  button, a.button {
    display: inline-block;
    background: var(--accent);
    color: #0b0d13;
    border: 1px solid var(--accent);
    padding: 0.6rem 1.1rem;
    border-radius: var(--radius-sm);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
  }

  button:hover, a.button:hover { background: #b9daff; border-color: #b9daff; }
  button:disabled { opacity: 0.5; cursor: default; background: var(--surface); color: var(--text-muted); border-color: var(--border); }

  .error { color: var(--error); }
</style>
</head>
<body>
  <h1>Simulacrum</h1>
  <p>Simulacrum is a private demo of a ROM/Merc-derived MUD engine, running as a baseline reference
     — it is not a public MUD. Connecting to it requires a trusted account and a one-time access
     code, entered as the first line of your MUD client's session.</p>

  <div id="status">Checking sign-in status…</div>
  <div id="action"></div>

  <script src="/app.js"></script>
</body>
</html>
