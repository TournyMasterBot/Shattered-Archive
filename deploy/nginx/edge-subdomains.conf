server_tokens off;

# ============================================================
# HTTP → HTTPS redirect (all known hosts)
# ============================================================
server {
  listen 80;
  server_name
    shatteredarchive.dev
    game-client.shatteredarchive.dev
    web-client.shatteredarchive.dev
    game-server.shatteredarchive.dev
    web-server.shatteredarchive.dev;

  return 301 https://$host$request_uri;
}

# ============================================================
# GAME CLIENT
# ============================================================
server {
  listen 443 ssl;
  server_name game-client.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  location /ws/game {
    proxy_pass http://game-server:31000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location / {
    proxy_pass http://game-client:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

# ============================================================
# WEB CLIENT
# ============================================================
server {
  listen 443 ssl;
  server_name web-client.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  location /ws/web {
    proxy_pass http://web-server:41000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location / {
    proxy_pass http://web-client:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

# ============================================================
# WEB SERVER (API)
# ============================================================
server {
  listen 443 ssl;
  server_name web-server.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  location / {
    proxy_pass http://web-server:41000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ============================================================
# GAME SERVER (API)
# ============================================================
server {
  listen 443 ssl;
  server_name game-server.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  location / {
    proxy_pass http://game-server:31000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ============================================================
# ROOT DOMAIN (diagnostic landing)
# ============================================================
server {
  listen 443 ssl;
  server_name shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  return 200 "ShatteredArchive edge (TLS) is running.\n";
  add_header Content-Type text/plain;
}
