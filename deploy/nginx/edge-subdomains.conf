server_tokens off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ============================================================
# DEFAULT HTTP (no redirect)
# ============================================================
server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  return 404;
}

# ============================================================
# DEFAULT HTTPS (no redirect)
# NOTE: If you later enable this, the cert/key paths must exist
#       or nginx will fail to start.
# ============================================================
# server {
#   listen 443 ssl default_server;
#   server_name _;
#
#   ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
#   ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;
#
#   return 404;
# }

# ============================================================
# GAME CLIENT (HTTP)
# ============================================================
server {
  listen 80;
  server_name game-client.shatteredarchive.dev;

  location /ws/game {
    proxy_pass http://game-server:31000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location / {
    proxy_pass http://game-client:80;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

