# ============================================================
# SHATTEREDARCHIVE.COM /data/ (C# server, CORS for log viewer)
# ============================================================
server {
  listen 80;
  server_name shatteredarchive.com www.shatteredarchive.com;
  include /etc/nginx/includes/security-headers.conf;

  location /data/ {
    resolver 127.0.0.11 valid=30s;
    set $csharp shatteredarchive-csharp:5000;
    proxy_pass http://$csharp;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    # Re-included because the add_header directives above discard everything inherited from
    # the server block — including the security headers. This location is public, GET-only,
    # read-only static data, so the wildcard CORS above is intentional and stays; what must
    # not silently vanish with it is nosniff.
    include /etc/nginx/includes/security-headers-api.conf;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Allow-Methods "GET, OPTIONS";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }
  }

  location /api/offline/ {
    resolver 127.0.0.11 valid=30s;
    set $csharp shatteredarchive-csharp:5000;
    proxy_pass http://$csharp;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# DSL LOG VIEWER (subdomain)
# ============================================================
server {
  listen 80;
  server_name dsl-log-viewer.shatteredarchive.com;
  include /etc/nginx/includes/security-headers.conf;

  location / {
    resolver 127.0.0.11 valid=30s;
    set $dsl_log_viewer dsl-log-viewer:5900;
    proxy_pass http://$dsl_log_viewer;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# MUD BUILDER (subdomain)
# Uses the resolver+variable pattern (like dsl-log-viewer) so the edge
# starts fine even when the builder containers are not running — the
# builder is additive and must never block the rest of the stack.
# ============================================================
server {
  listen 80;
  server_name build.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers.conf;

  location /api/ {
    # Deliberately the loosest of the three zones (10r/s): the builder is a chatty
    # authoring UI — one Areas or Map dashboard load fans out into dozens of reads, and
    # the Simulate pane more. This is a ceiling on scripted abuse of the file-reading
    # routes (/api/audit, /api/state, /api/world), not a throttle on real building.
    limit_req zone=builder_api burst=60 nodelay;
    limit_req_status 429;

    # nginx's BUILT-IN default is 1m, and nothing above sets it — but /api/import and
    # /api/snippets both accept 2mb bodies, so a large .are import was dying here with
    # nginx's HTML 413 before it ever reached the app. Deliberately set ABOVE the app's
    # largest limit rather than equal to it: express holds the exact per-route caps
    # (2mb import/snippets, 1mb areas/world/skills, 64kb auth, 4kb presence) and returns
    # a clean JSON error, so this stays a coarse outer guard and never the binding one.
    client_max_body_size 3m;

    resolver 127.0.0.11 valid=30s;
    set $mud_builder_server mud-builder-server:61000;
    proxy_pass http://$mud_builder_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_server mud-builder-server:61000;
    proxy_pass http://$mud_builder_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_client mud-builder-client:80;
    proxy_pass http://$mud_builder_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# KINGDOM TACTICS (subdomain) — Phase F. Same resolver+variable pattern as
# build.shatteredarchive.dev: the edge must start cleanly even when these two
# containers aren't running (additive, not in nginx's depends_on). /api/kt/
# and /ws/kt (WebSocket) go to kingdom-tactics-server; /health too;
# everything else to the kingdom-tactics-client SPA. Single subdomain by
# design (see kt-client's features/auth/kt-auth-config.ts) — mirrors
# mud-builder/auth, NOT a separate client/server subdomain pair.
# ============================================================
server {
  listen 80;
  server_name kingdom-tactics.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers.conf;

  location /api/kt/ {
    resolver 127.0.0.11 valid=30s;
    set $kt_server kingdom-tactics-server:51000;
    proxy_pass http://$kt_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /ws/kt {
    resolver 127.0.0.11 valid=30s;
    set $kt_server kingdom-tactics-server:51000;
    proxy_pass http://$kt_server;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $kt_server kingdom-tactics-server:51000;
    proxy_pass http://$kt_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $kt_client kingdom-tactics-client:80;
    proxy_pass http://$kt_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# AUTH (subdomain)
# Same resolver+variable pattern as build.shatteredarchive.dev: the edge must
# start cleanly even when auth-server/auth-client aren't running (additive).
# /api/ and /health go to auth-server; everything else to the auth-client SPA.
# ============================================================
server {
  listen 80;
  server_name auth.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers.conf;

  # Device-bound credentials. challenge/assert are public by design, and a signed-in
  # browser hits them on a timer, so this gets its own zone rather than competing with
  # interactive traffic in auth_api. Longer prefix than /api/, matched first.
  location /api/device/ {
    limit_req zone=device_auth burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;

    resolver 127.0.0.11 valid=30s;
    set $auth_server auth-server:62000;
    proxy_pass http://$auth_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The unauthenticated credential surface: login, signup, forgot-password,
  # reset-password. Tighter than /api/ below because this is what gets sprayed, and
  # because the reset endpoints send outbound mail. A longer prefix than /api/, so
  # nginx matches these here first. Body cap mirrors auth.ts's express.json 64kb.
  location /api/auth/ {
    limit_req zone=auth_login burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    resolver 127.0.0.11 valid=30s;
    set $auth_server auth-server:62000;
    proxy_pass http://$auth_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    # Everything else the SPA calls (account, keys, admin, sso, token-exchange).
    # 5r/s sustained with a wide burst: an authenticated page doing several calls at
    # once is fine, a script walking the API is not.
    limit_req zone=auth_api burst=40 nodelay;
    limit_req_status 429;

    resolver 127.0.0.11 valid=30s;
    set $auth_server auth-server:62000;
    proxy_pass http://$auth_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $auth_server auth-server:62000;
    proxy_pass http://$auth_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $auth_client auth-client:80;
    proxy_pass http://$auth_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# SCRUM POKER (subdomain)
# Same resolver+variable pattern as build.shatteredarchive.dev: the edge must start cleanly
# even when these two containers aren't running (additive, not in nginx's depends_on).
# /api/scrum/ and /health go to scrum-poker-server, /ws/scrum is the room websocket, and
# everything else falls through to the SPA — whose own conf serves index.html for unknown
# paths so a pasted /room/<code> link opens cold. This block MUST stay route-for-route
# identical to the HTTPS one in includes/tls-dev.conf.
# ============================================================
server {
  listen 80;
  server_name scrum-poker.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers.conf;

  location /api/scrum/ {
    # Room creation only (see the scrum_create map); burst absorbs a team arriving together.
    limit_req zone=scrum_create burst=10 nodelay;
    client_max_body_size 16k;

    resolver 127.0.0.11 valid=30s;
    set $scrum_server scrum-poker-server:63000;
    proxy_pass http://$scrum_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /ws/scrum {
    # Generous per-IP socket ceiling: an office behind one NAT address is a couple of dozen
    # tabs, so this only catches a single host trying to hold thousands of connections open.
    limit_conn scrum_conn 128;

    resolver 127.0.0.11 valid=30s;
    set $scrum_server scrum-poker-server:63000;
    proxy_pass http://$scrum_server;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    # A planning session leaves the socket open with long quiet stretches between stories.
    # The client also heartbeats every 45s, but the generous timeout is what keeps a room
    # from silently dropping while people argue about the story.
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $scrum_server scrum-poker-server:63000;
    proxy_pass http://$scrum_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $scrum_client scrum-poker-client:80;
    proxy_pass http://$scrum_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# ROOT DOMAIN (HTTP)
# ============================================================
server {
  listen 80;
  server_name shatteredarchive.dev;
  include /etc/nginx/includes/security-headers-api.conf;

  add_header Content-Type text/plain;
  return 200 "ShatteredArchive edge (HTTP) is running.\n";
}