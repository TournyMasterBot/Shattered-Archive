server_tokens off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ------------------------------------------------------------
# Real client IP — REQUIRED for any subdomain published through the FRONT proxy.
#
# Every limit_* zone below keys on $binary_remote_addr. For a request that reaches this
# edge directly, that is the client. For a request arriving via the front proxy
# (DSL/nginx/shattered_archive.site -> this host) it is the FRONT PROXY's single address
# for every request on the internet, which silently collapses the per-IP limits into
# GLOBAL ones: 10 room creations per minute for the whole world, and 128 total websockets
# rather than 128 per office. Two teams would then knock each other offline.
#
# So: trust that one hop and take the client from the X-Forwarded-For it already sets.
#
# FRONT_PROXY_CIDR comes from the nginx service's environment in both compose files and is
# substituted by the entrypoint's envsubst pass, exactly like ${NGINX_TLS_INCLUDE_FILE}
# below. It is therefore a REQUIRED env var — envsubst leaves an undefined ${...} in the
# rendered conf verbatim and nginx then refuses to start. Override per-host/per-env there
# rather than editing this file.
#
# Keep the mask tight. Anything trusted here can forge X-Forwarded-For and skip the limits
# entirely, so this must stay the proxy's own address — never a broad CIDR or 0.0.0.0/0.
# Harmless on a stack that is NOT behind the front proxy (the experimental one): no traffic
# ever arrives from that address, so the rewrite simply never fires.
#
# recursive on = walk X-Forwarded-For right-to-left past trusted hops. A client that forges
# the header still loses: the front proxy APPENDS the real address, so the rightmost
# untrusted entry is the true one.
# ------------------------------------------------------------
set_real_ip_from  ${FRONT_PROXY_CIDR};
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# ------------------------------------------------------------
# Scrum Poker edge limits.
#
# scrum-poker-server has no accounts by design, so `POST /api/scrum/rooms` is open to anyone
# who can reach it and the app's own room cap can only start refusing EVERYONE once it fills.
# Rate-limiting the mint per IP is the right layer for that, and belongs here rather than in
# the app, which sits behind this proxy and would only ever see nginx's address.
#
# Only POSTs are counted: the key is empty for every other method and nginx does not account
# empty keys, so the join form's GET /api/scrum/rooms/<id> lookups are never throttled. That
# matters because a whole team typically shares one office NAT address — the limits below are
# sized so a room full of colleagues arriving at once is nowhere near them.
#
# Zones must be declared before the files that use them; keep this above the TLS include.
# ------------------------------------------------------------
map $request_method $scrum_create_key {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone  $scrum_create_key   zone=scrum_create:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=scrum_conn:1m;

# ------------------------------------------------------------
# Auth + MUD Builder edge limits.
#
# Same reasoning as scrum above — these apps sit behind this proxy and would only ever
# see nginx's address, so per-IP accounting belongs at this layer. Unlike scrum they DO
# have accounts, but that only narrows the gap: auth-server's LoginLockout escalates on
# FAILED passwords by username+IP and says nothing about request VOLUME, and nothing at
# all covered introspect, token-exchange, sso, or the builder's file-reading GETs.
#
# Service-to-service traffic is NOT charged against these zones. AUTH_SERVER_URL points
# at the internal alias auth-server.shatteredarchive.dev:62000 (see deploy/docker-compose
# .shattered-archive-experimental.yml), so another container's introspect/token-exchange
# call reaches auth-server directly on its own port and never transits the edge. Only
# browser traffic lands here — which is why these limits can be sized for humans.
#
# Sized for people behind ONE shared NAT address, not for a single desktop: a team
# logging in together, or a builder whose Areas/Map dashboard fires a few dozen requests
# per page load, must sit nowhere near these ceilings. They are set to stop credential
# stuffing and scripted scraping, not to shape normal use.
# ------------------------------------------------------------
limit_req_zone  $binary_remote_addr  zone=auth_login:1m    rate=30r/m;
# /api/device/challenge and /api/device/assert are deliberately UNAUTHENTICATED (a deviceId
# is not a secret and a signature is self-authenticating), so they need their own ceiling
# rather than inheriting the general one. Sized off real usage: a 10-minute access token
# means ~6 mints/hour per open tab, so even a dozen tabs plus enroll/list traffic sits far
# below this, while it still refuses anything trying to grind signatures or enumerate IDs.
limit_req_zone  $binary_remote_addr  zone=device_auth:1m   rate=120r/m;
limit_req_zone  $binary_remote_addr  zone=auth_api:1m      rate=300r/m;
limit_req_zone  $binary_remote_addr  zone=builder_api:1m   rate=600r/m;

# Toggle local TLS blocks by setting:
#   NGINX_TLS_INCLUDE_FILE=tls-dev.conf   (dev)
#   NGINX_TLS_INCLUDE_FILE=tls-off.conf   (prod / disabled)
include /etc/nginx/includes/${NGINX_TLS_INCLUDE_FILE};

# ============================================================
# DEFAULT HTTP (no redirect)
# ============================================================
server {
  listen 80 default_server;
  server_name _;
  include /etc/nginx/includes/security-headers-api.conf;

  location = /healthz {
    add_header Content-Type text/plain;
    # add_header above drops the server block's inherited headers — restore them.
    include /etc/nginx/includes/security-headers-api.conf;
    return 200 "ok\n";
  }

  return 404;
}

# ============================================================
# GAME CLIENT (HTTP)
# ============================================================
server {
  listen 80;
  server_name game-client.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers.conf;

  location /ws/game {
    proxy_pass http://game-server:31000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  # API routes proxied to web-server (strips /api/web/ prefix)
  # e.g. /api/web/maps/continent/names -> web-server:41000/maps/continent/names
  location /api/web/ {
    proxy_pass http://web-server:41000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://game-client:80;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

