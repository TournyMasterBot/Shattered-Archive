server_tokens off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ------------------------------------------------------------
# Scrum Poker edge limits.
#
# scrum-poker-server has no accounts by design, so `POST /api/scrum/rooms` is open to anyone
# who can reach it and the app's own room cap can only start refusing EVERYONE once it fills.
# Rate-limiting the mint per IP is the right layer for that, and belongs here rather than in
# the app, which sits behind this proxy and would only ever see nginx's address.
#
# Only POSTs are counted: the key is empty for every other method and nginx does not account
# empty keys, so the join form's GET /api/scrum/rooms/<id> lookups are never throttled. That
# matters because a whole team typically shares one office NAT address — the limits below are
# sized so a room full of colleagues arriving at once is nowhere near them.
#
# Zones must be declared before the files that use them; keep this above the TLS include.
# ------------------------------------------------------------
map $request_method $scrum_create_key {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone  $scrum_create_key   zone=scrum_create:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=scrum_conn:1m;

# Toggle local TLS blocks by setting:
#   NGINX_TLS_INCLUDE_FILE=tls-dev.conf   (dev)
#   NGINX_TLS_INCLUDE_FILE=tls-off.conf   (prod / disabled)
include /etc/nginx/includes/${NGINX_TLS_INCLUDE_FILE};

# ============================================================
# DEFAULT HTTP (no redirect)
# ============================================================
server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  return 404;
}

# ============================================================
# GAME CLIENT (HTTP)
# ============================================================
server {
  listen 80;
  server_name game-client.shatteredarchive.dev;

  location /ws/game {
    proxy_pass http://game-server:31000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  # API routes proxied to web-server (strips /api/web/ prefix)
  # e.g. /api/web/maps/continent/names -> web-server:41000/maps/continent/names
  location /api/web/ {
    proxy_pass http://web-server:41000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://game-client:80;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

