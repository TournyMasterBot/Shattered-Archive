server_tokens off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Toggle local TLS blocks by setting:
#   NGINX_TLS_INCLUDE_FILE=tls-dev.conf   (dev)
#   NGINX_TLS_INCLUDE_FILE=tls-off.conf   (prod / disabled)
include /etc/nginx/includes/${NGINX_TLS_INCLUDE_FILE};

# ============================================================
# DEFAULT HTTP (no redirect)
# ============================================================
server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  return 404;
}

# ============================================================
# GAME CLIENT (HTTP)
# ============================================================
server {
  listen 80;
  server_name game-client.shatteredarchive.dev;

  location /ws/game {
    proxy_pass http://game-server:31000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  # API routes proxied to web-server (strips /api/web/ prefix)
  # e.g. /api/web/maps/continent/names -> web-server:41000/maps/continent/names
  location /api/web/ {
    proxy_pass http://web-server:41000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://game-client:80;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# WEB CLIENT (HTTP)
# ============================================================
server {
  listen 80;
  server_name web-client.shatteredarchive.dev;

  location /ws/web {
    proxy_pass http://web-server:41000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location / {
    proxy_pass http://web-client:80;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# WEB SERVER (API) (HTTP)
# ============================================================
server {
  listen 80;
  server_name web-server.shatteredarchive.dev;

  location / {
    proxy_pass http://web-server:41000;
    proxy_http_version 1.1;

    # harmless for normal HTTP, required for WS
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# GAME SERVER (API) (HTTP)
# ============================================================
server {
  listen 80;
  server_name game-server.shatteredarchive.dev;

  location / {
    proxy_pass http://game-server:31000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# SHATTEREDARCHIVE.COM /data/ (C# server, CORS for log viewer)
# ============================================================
server {
  listen 80;
  server_name shatteredarchive.com www.shatteredarchive.com;

  location /data/ {
    resolver 127.0.0.11 valid=30s;
    set $csharp shatteredarchive-csharp:5000;
    proxy_pass http://$csharp;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Allow-Methods "GET, OPTIONS";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }
  }

  location /api/offline/ {
    resolver 127.0.0.11 valid=30s;
    set $csharp shatteredarchive-csharp:5000;
    proxy_pass http://$csharp;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# DSL LOG VIEWER (subdomain)
# ============================================================
server {
  listen 80;
  server_name dsl-log-viewer.shatteredarchive.com;

  location / {
    resolver 127.0.0.11 valid=30s;
    set $dsl_log_viewer dsl-log-viewer:5900;
    proxy_pass http://$dsl_log_viewer;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# MUD BUILDER (subdomain)
# Uses the resolver+variable pattern (like dsl-log-viewer) so the edge
# starts fine even when the builder containers are not running — the
# builder is additive and must never block the rest of the stack.
# ============================================================
server {
  listen 80;
  server_name build.shatteredarchive.dev;

  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_server mud-builder-server:61000;
    proxy_pass http://$mud_builder_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_server mud-builder-server:61000;
    proxy_pass http://$mud_builder_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_client mud-builder-client:80;
    proxy_pass http://$mud_builder_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# AUTH (subdomain)
# Same resolver+variable pattern as build.shatteredarchive.dev: the edge must
# start cleanly even when auth-server/auth-client aren't running (additive).
# /api/ and /health go to auth-server; everything else to the auth-client SPA.
# ============================================================
server {
  listen 80;
  server_name auth.shatteredarchive.dev;

  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $auth_server auth-server:62000;
    proxy_pass http://$auth_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $auth_server auth-server:62000;
    proxy_pass http://$auth_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $auth_client auth-client:80;
    proxy_pass http://$auth_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# ROOT DOMAIN (HTTP)
# ============================================================
server {
  listen 80;
  server_name shatteredarchive.dev;

  add_header Content-Type text/plain;
  return 200 "ShatteredArchive edge (HTTP) is running.\n";
}