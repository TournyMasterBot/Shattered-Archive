# ANALYTICS-ONLY Content-Security-Policy profile — Google Analytics (GA4), no ads.
#
# Include once per `server { }`, INSTEAD of security-headers.conf (never alongside it: nginx
# appends add_header rather than replacing, so two CSP headers means the browser enforces the
# INTERSECTION and the loosened directives below would buy nothing).
#
# ---------------------------------------------------------------------------------------
# READ THIS BEFORE ADDING THE INCLUDE TO ANOTHER SERVER BLOCK.
#
# This is deliberately NOT security-headers-ads.conf with the ad origins trimmed out — it is a
# separate, narrower file, because the two profiles have different intended lifetimes. Anyone
# auditing "which hosts can load third-party script" should be able to read this file and see
# ONLY the Google Analytics origins, with no ad-network entries to reason past. If a host on
# this profile ever grows an ad unit, that is a decision to make explicitly by switching it to
# security-headers-ads.conf, not by quietly appending ad origins to this one.
#
# Like the ads profile, script-src does NOT contain 'unsafe-inline' — gtag.js is fetched from
# an allowlisted HOST (www.googletagmanager.com), which is a host-source match, not an inline
# one, and this app's own initialisation code lives in an external same-origin bundled module
# (analytics.ts), never inline markup. There is no ad creative here and therefore no
# cross-origin iframe to reason about either — frame-src stays unset, unlike the ads profile.
#
# WHICH HOSTS BELONG HERE: an app that carries GA but no ad unit, no login form, no password
# field, and no service key calling auth-server. soulsteel.shatteredarchive.dev is the first.
# Do NOT include this on auth.shatteredarchive.dev under any circumstances — that host serves
# the login, signup and password-reset forms and sets the session cookie. Do not include it on
# game-client either, for the same eval-plus-third-party-script reasoning
# security-headers-ads.conf gives for itself.
# ---------------------------------------------------------------------------------------
include /etc/nginx/includes/security-headers-common.conf;

# Origin allowlist, and what each one is for. Trimming either surfaces as a silently blank
# analytics tag plus a console CSP violation, never as an error the app can catch:
#
#   www.googletagmanager.com   the gtag.js loader (analytics.ts injects it)
#   *.google-analytics.com,    GA4 measurement beacons. Wildcards because GA4 shards
#   *.analytics.google.com     regionally (region1.google-analytics.com and friends).
#
# DELIBERATELY REMOVED relative to the strict profile:
#   connect-src https://auth.shatteredarchive.dev  — same reasoning security-headers-ads.conf
#     gives for scrum-poker: this app holds no service key and does not call auth-server, so
#     there is no reason to leave the hub reachable cross-origin from a host with no need to
#     reach it.
#
# KEPT UNCHANGED, deliberately:
#   default-src 'self'      nothing inherits the GA origins; each directive opts in by name.
#   style-src 'unsafe-inline'  same React `style=` reason as the strict profile.
#   frame-ancestors 'none'  this app is never embedded, and GA renders no frame of its own.
#   base-uri 'self' / form-action 'self' / object-src 'none'
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data:; connect-src 'self' wss://$host https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
