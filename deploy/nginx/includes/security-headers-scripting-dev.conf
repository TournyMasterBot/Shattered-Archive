# RELAXED CSP profile, DEV-MACHINE VARIANT of security-headers-scripting.conf.
#
# Selected via ${NGINX_CSP_SCRIPTING_FILE} in the game-client server block, the same
# mechanism as ${NGINX_TLS_INCLUDE_FILE}. The local stack mirrors production, but its C#
# site service (Server.Web.Public) is published on the host at :5000 instead of sitting
# behind the real site domain, so the client's fetches go to http://localhost:5000 and the
# production connect-src refuses them — a CSP refusal surfaces in the app as a bare
# "Failed to fetch", with no status code and nothing in the server log.
#
# KEEP IN STEP with security-headers-scripting.conf: these two files must differ on the
# connect-src origin and NOTHING else. Everything below is copied from it verbatim; read
# that file for why 'unsafe-eval' and worker-src blob: are load-bearing here.
include /etc/nginx/includes/security-headers-common.conf;

# connect-src: http://localhost:5000 replaces production's https://shatteredarchive.com.
# It is this machine's own published port, never reachable from anywhere else, and it must
# never appear in the production profile — there it would name whatever the VISITOR happens
# to be running on their own :5000.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://auth.shatteredarchive.dev http://localhost:5000 wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
