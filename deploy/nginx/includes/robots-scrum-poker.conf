# `location = /robots.txt` for scrum-poker.shatteredarchive.dev — the one app host that is BOTH
# publicly useful content AND carries an ad unit, so it needs its own rules rather than the
# blanket robots-disallow-all.conf.
#
# Include inside the scrum-poker `server { }`, in BOTH schemes (edge-subdomains.conf's :80 block
# and includes/tls-dev.conf's :443 block) — see the mirror rule in tls-dev.conf's header.
#
# ---------------------------------------------------------------------------------------
# ONE GROUP NOW, NOT TWO (changed 2026-08-06).
#
# The ad moved to the landing page only — it no longer renders on room pages (App.tsx gates
# <AdSlot /> on route.name === 'landing'). That removes the one reason Mediapartners-Google (the
# AdSense crawler) ever needed a `/room/` exemption the general rule below doesn't get: an ad
# crawler only fetches pages an ad request already told it about, and no ad request will ever
# name a room page again. So it now reads the SAME rule as every other agent, and there is
# nothing left to carve out.
#
# `Disallow: /room/` still applies to everyone, including Mediapartners-Google, for the same
# reason as before: a room id is a UUID and that UUID *is* the membership credential — anyone
# holding the link is in the room. An indexed room URL would hand room access to anyone who ran
# the right search, which is a real and quite bad outcome for a tool people paste ticket titles
# into. The landing page stays crawlable, which is what an ad-bearing page needs for discovery.
#
# NOT A SECURITY CONTROL. robots.txt is advisory. What actually keeps a room private is that its
# UUID is unguessable; this file only stops compliant crawlers from publishing one they happened
# to encounter (a pasted link in a public forum, say). Do not rely on it for anything.
# ---------------------------------------------------------------------------------------
location = /robots.txt {
  default_type text/plain;
  # No add_header here on purpose — it would discard the server block's inherited security
  # headers. nginx does not merge add_header across levels; default_type is safe.
  # The Sitemap directive points at the APEX's sitemap, not a local one, and that is deliberate
  # rather than lazy. The constellation has a single sitemap; naming it from this host's
  # robots.txt is the sanctioned way to authorise that sitemap to contain THIS host's URL
  # (https://scrum-poker.shatteredarchive.dev/), which it does. Without this line that entry is
  # a cross-host URL with no ownership signal and Search Console may refuse it.
  return 200 'User-agent: *
Disallow: /room/
Allow: /

Sitemap: https://shatteredarchive.dev/sitemap.xml
';
}
