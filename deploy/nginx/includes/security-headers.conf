# STRICT Content-Security-Policy profile — the DEFAULT for browser-facing server blocks
# (every SPA, and the mixed auth host that serves both a SPA and its API).
#
# Include once per `server { }`; the non-CSP headers come from the shared file below. Do not
# also include another profile in the same block — nginx emits both CSP headers and the
# browser enforces the intersection. API-only hosts use security-headers-api.conf instead;
# game-client, which must run an interpreter in the page, uses security-headers-scripting.conf.
include /etc/nginx/includes/security-headers-common.conf;

# Notes on the non-obvious directives:
#
#  script-src 'self'   — no app on this profile calls the Function constructor, and Vite emits
#                        external module scripts. This is what makes an injected <script>
#                        inert, so keep it free of 'unsafe-inline'/'unsafe-eval'. A host that
#                        genuinely needs eval takes the scripting profile rather than loosening
#                        this — that keeps the exception to one named host instead of all.
#
#                        CORRECTION (2026-08-05): this note used to also claim no app on the
#                        profile contains an inline <script>. That is FALSE, and was already
#                        false when written — apps/scrum-poker-client/index.html carries an
#                        inline theme-flash guard that reads localStorage before first paint,
#                        and this policy has been silently refusing it, so dark-mode users get
#                        a white flash on that host. It is a cosmetic-only failure (the app
#                        re-reads the same key on mount; the inline copy only wins the race),
#                        which is why it went unnoticed. Do NOT "fix" it by adding
#                        'unsafe-inline' here — that would weaken every app on the profile for
#                        one flash. Either move the guard to an external module, give it a
#                        nonce/hash, or accept the flash. Note scrum-poker now takes
#                        security-headers-ads.conf in production, which permits inline for
#                        UNRELATED reasons (AdSense) and incidentally lets that guard run —
#                        so the symptom is currently visible only on the experimental stack.
#  style-src            'unsafe-inline' IS required: React renders `style=` attributes, which
#                        CSP treats as inline styles. Style injection is not script execution,
#                        so this does not weaken the protection above.
#  connect-src          'self' for each app's own API, plus the auth hub, which every app
#                        talks to cross-origin for device credentials and SSO — including the
#                        .com apps, which authenticate against the .dev hub. wss://$host covers
#                        the real-time apps (game, kingdom-tactics, scrum-poker) without
#                        listing each one.
#  frame-ancestors 'none' — clickjacking. These apps are never embedded.
#  base-uri 'self'      — stops an injected <base> from re-pointing every relative URL.
#  form-action 'self'   — stops an injected form from posting credentials off-site.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://auth.shatteredarchive.dev wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
