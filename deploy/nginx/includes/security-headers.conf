# Baseline security headers + Content-Security-Policy for BROWSER-FACING server blocks
# (every SPA, and the mixed auth host that serves both a SPA and its API).
#
# Include once per `server { }`. API-only hosts use security-headers-api.conf instead.
#
# ---------------------------------------------------------------------------------------
# nginx gotcha, do not skip: `add_header` does NOT merge across levels. A `location` that
# declares ANY add_header of its own silently discards every add_header inherited from the
# enclosing server block — so a location adding, say, a Cache-Control or CORS header loses
# all of these too. Such locations must include this file AGAIN. Grep for `add_header`
# inside locations before assuming coverage.
# ---------------------------------------------------------------------------------------

# MIME sniffing turns a user-uploaded .txt into an executable .html in older browsers.
add_header X-Content-Type-Options nosniff always;

# Cross-origin referrers leak path + query (which can carry tokens) to third parties.
# strict-origin-when-cross-origin sends the full URL same-origin, bare origin cross-origin,
# and nothing at all on a downgrade — strictly better than no-referrer-when-downgrade, which
# sends the FULL url cross-origin.
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Legacy companion to CSP's frame-ancestors below, for browsers that predate it. DENY rather
# than SAMEORIGIN: none of these apps frame each other, so there is nothing to allow.
add_header X-Frame-Options DENY always;

# Content-Security-Policy. Notes on the non-obvious directives:
#
#  script-src 'self'   — verified safe: no app's index.html contains an inline <script>, and
#                        Vite emits external module scripts. This is what makes an injected
#                        <script> inert, so keep it free of 'unsafe-inline'/'unsafe-eval'.
#  style-src            'unsafe-inline' IS required: React renders `style=` attributes, which
#                        CSP treats as inline styles. Style injection is not script execution,
#                        so this does not weaken the protection above.
#  connect-src          'self' for each app's own API, plus the auth hub, which every app
#                        talks to cross-origin for device credentials and SSO — including the
#                        .com apps, which authenticate against the .dev hub. wss://$host covers
#                        the real-time apps (game, kingdom-tactics, scrum-poker) without
#                        listing each one.
#  frame-ancestors 'none' — clickjacking. These apps are never embedded.
#  base-uri 'self'      — stops an injected <base> from re-pointing every relative URL.
#  form-action 'self'   — stops an injected form from posting credentials off-site.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://auth.shatteredarchive.dev wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
