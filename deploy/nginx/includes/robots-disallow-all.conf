# Shared `location = /robots.txt` for every host that is an APPLICATION or an API rather than
# content: crawl nothing.
#
# Include inside a `server { }`. nginx includes are textual, so a location block written in an
# include behaves exactly as if it were inline.
#
# ---------------------------------------------------------------------------------------
# WHY AN EXPLICIT DISALLOW RATHER THAN LETTING /robots.txt 404.
#
#  1. It would NOT 404. Every app block here ends in `location /` proxying to a container whose
#     own conf does `try_files $uri $uri/ /index.html`, so a request for /robots.txt comes back
#     as the app's HTML with a 200 status. A crawler handed HTML where it expected robots.txt
#     treats the site as having no rules at all and crawls everything — the opposite of intent.
#  2. That same SPA fallback means EVERY path returns 200 HTML, so a crawler can invent
#     unlimited URLs that each look like a distinct page. That is unbounded crawl waste and
#     duplicate content.
#  3. There is nothing on these hosts to index. They are tools. The indexable entry point for
#     all of them is the hub page at https://shatteredarchive.dev, which links to each one.
#
# THIS IS NOT A SECURITY CONTROL. robots.txt is advisory: a well-behaved crawler honours it and
# anything hostile ignores it. Nothing here is protected BY this file — the auth hub's session
# guards and the builder's bearer gate are what protect those hosts. All this does is keep pages
# that should never appear in search results out of search results.
#
# DELIBERATELY BLOCKS Mediapartners-Google (the AdSense crawler) along with everything else,
# because none of these hosts carries an ad unit and it has nothing to fetch here. scrum-poker
# DOES carry one and takes robots-scrum-poker.conf instead. Never point an ad-bearing host at
# this file: blocking that agent is precisely what makes AdSense stop serving ads.
# ---------------------------------------------------------------------------------------
location = /robots.txt {
  default_type text/plain;
  # No add_header here on purpose. This location inherits the enclosing server block's security
  # headers, and declaring even one add_header would silently discard ALL of them — nginx does
  # not merge add_header across levels. default_type is not an add_header, so it is safe.
  return 200 'User-agent: *
Disallow: /
';
}
