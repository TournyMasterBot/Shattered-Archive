# ============================================================
# MUD BUILDER (HTTPS)
# Resolver+variable pattern: the edge starts fine even when the
# builder containers are not running (builder is additive).
# ============================================================
server {
  listen 443 ssl;
  server_name build.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  location /api/ {
    # Loosest of the three zones — the builder UI is chatty. See edge-subdomains.conf.
    limit_req zone=builder_api burst=60 nodelay;
    limit_req_status 429;

    # Above the app's largest per-route cap (2mb import/snippets); nginx's built-in
    # default of 1m was silently 413-ing big .are imports. See edge-subdomains.conf.
    client_max_body_size 3m;

    resolver 127.0.0.11 valid=30s;
    set $mud_builder_server mud-builder-server:61000;
    proxy_pass http://$mud_builder_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_server mud-builder-server:61000;
    proxy_pass http://$mud_builder_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_client mud-builder-client:80;
    proxy_pass http://$mud_builder_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# KINGDOM TACTICS (HTTPS) — Phase F. Same resolver+variable pattern as
# build.shatteredarchive.dev. Must mirror edge-subdomains.conf's HTTP block
# route-for-route — a real deploy gap (missed on the first pass: kt-server's
# KT_CLIENT_ALLOWED_RETURN_ORIGINS is https-only, matching this repo's own
# public-subdomain convention, but this HTTPS block didn't exist yet, so a
# real https:// request 404'd at nginx's default catch-all instead of ever
# reaching kt-server) caught by live-testing the real hostname end to end,
# not by review.
# ============================================================
server {
  listen 443 ssl;
  server_name kingdom-tactics.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  location /api/kt/ {
    resolver 127.0.0.11 valid=30s;
    set $kt_server kingdom-tactics-server:51000;
    proxy_pass http://$kt_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /ws/kt {
    resolver 127.0.0.11 valid=30s;
    set $kt_server kingdom-tactics-server:51000;
    proxy_pass http://$kt_server;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $kt_server kingdom-tactics-server:51000;
    proxy_pass http://$kt_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $kt_client kingdom-tactics-client:80;
    proxy_pass http://$kt_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# AUTH (HTTPS)
# Same resolver+variable pattern as build.shatteredarchive.dev: the edge must
# start cleanly even when auth-server/auth-client aren't running (additive).
# /api/ and /health go to auth-server; everything else to the auth-client SPA.
# ============================================================
server {
  listen 443 ssl;
  server_name auth.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  # Credential surface — see the zone comments in edge-subdomains.conf. Longer prefix
  # than /api/ below, so nginx matches these here first.
  location /api/auth/ {
    limit_req zone=auth_login burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    resolver 127.0.0.11 valid=30s;
    set $auth_server auth-server:62000;
    proxy_pass http://$auth_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    limit_req zone=auth_api burst=40 nodelay;
    limit_req_status 429;

    resolver 127.0.0.11 valid=30s;
    set $auth_server auth-server:62000;
    proxy_pass http://$auth_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $auth_server auth-server:62000;
    proxy_pass http://$auth_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $auth_client auth-client:80;
    proxy_pass http://$auth_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# SCRUM POKER (HTTPS)
# Must mirror edge-subdomains.conf's HTTP block route-for-route — the same gap that bit
# kingdom-tactics (an https:// request 404'ing at the default catch-all because only the
# HTTP block existed). Note the client opens `wss://` whenever the page is https, so
# /ws/scrum has to be here, not only in the HTTP block.
# ============================================================
server {
  listen 443 ssl;
  server_name scrum-poker.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  location /api/scrum/ {
    # Mirrors the HTTP block: per-IP limit on room creation only (zones live in
    # edge-subdomains.conf, which includes this file after declaring them).
    limit_req zone=scrum_create burst=10 nodelay;
    client_max_body_size 16k;

    resolver 127.0.0.11 valid=30s;
    set $scrum_server scrum-poker-server:63000;
    proxy_pass http://$scrum_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /ws/scrum {
    # Mirrors the HTTP block's per-IP socket ceiling.
    limit_conn scrum_conn 128;

    resolver 127.0.0.11 valid=30s;
    set $scrum_server scrum-poker-server:63000;
    proxy_pass http://$scrum_server;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $scrum_server scrum-poker-server:63000;
    proxy_pass http://$scrum_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $scrum_client scrum-poker-client:80;
    proxy_pass http://$scrum_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# ROOT DOMAIN (HTTPS)
# ============================================================
server {
  listen 443 ssl;
  server_name shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  add_header Content-Type text/plain;
  return 200 "ShatteredArchive edge (HTTPS) is running.\n";
}