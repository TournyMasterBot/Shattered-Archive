# ============================================================
# DEFAULT HTTPS (no redirect)
# ============================================================
server {
  listen 443 ssl default_server;
  server_name _;
  include /etc/nginx/includes/security-headers-api.conf;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  return 404;
}

# ============================================================
# GAME CLIENT (HTTPS)
# ============================================================
server {
  listen 443 ssl;
  server_name game-client.shatteredarchive.dev;
  # NOT the strict profile: this app's user-script feature (and the Lua/Python interpreters
  # it bundles) needs 'unsafe-eval' — see security-headers-scripting.conf for why.
  #
  # The -dev variant, hardcoded rather than ${NGINX_CSP_SCRIPTING_FILE} like the :80 block
  # in edge-subdomains.conf: envsubst only runs over that one template file, so a ${...}
  # here would reach nginx literally and fail to open. Hardcoding is correct anyway — THIS
  # FILE is already the dev-only half of the NGINX_TLS_INCLUDE_FILE pair (production loads
  # tls-off.conf and never reads this), so the dev CSP profile is the only one that belongs.
  #
  # This block is the one a browser actually hits on this machine: the dev stack is browsed
  # over https://, so patching only the :80 block leaves the page on the production policy
  # and the C# site fetches keep failing as "Failed to fetch".
  include /etc/nginx/includes/security-headers-scripting-dev.conf;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  # resolver + variable upstream. A literal hostname in proxy_pass is resolved once at config
  # load and cached for the worker's lifetime, so recreating an app container without also
  # recreating nginx pins this block to an address docker has since reassigned — see the long
  # note on the matching :80 block in edge-subdomains.conf. Keep the two in step.
  location /ws/game {
    resolver 127.0.0.11 valid=30s;
    set $game_server game-server:31000;
    proxy_pass http://$game_server;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  # API routes proxied to web-server (strips /api/web/ prefix)
  # e.g. /api/web/maps/continent/names -> web-server:41000/maps/continent/names
  location /api/web/ {
    resolver 127.0.0.11 valid=30s;
    set $web_server web-server:41000;
    # `rewrite ... break` rather than a trailing slash on proxy_pass: nginx passes a URI
    # written after a VARIABLE upstream through verbatim instead of rewriting the prefix,
    # so `http://$web_server/` would send a bare "/" for every request.
    rewrite ^/api/web/(.*)$ /$1 break;
    proxy_pass http://$web_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $game_client game-client:80;
    proxy_pass http://$game_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

