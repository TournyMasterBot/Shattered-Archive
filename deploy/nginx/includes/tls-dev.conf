# ============================================================
# MUD BUILDER (HTTPS)
# Resolver+variable pattern: the edge starts fine even when the
# builder containers are not running (builder is additive).
# ============================================================
server {
  listen 443 ssl;
  server_name build.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_server mud-builder-server:61000;
    proxy_pass http://$mud_builder_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /health {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_server mud-builder-server:61000;
    proxy_pass http://$mud_builder_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    resolver 127.0.0.11 valid=30s;
    set $mud_builder_client mud-builder-client:80;
    proxy_pass http://$mud_builder_client;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# ============================================================
# ROOT DOMAIN (HTTPS)
# ============================================================
server {
  listen 443 ssl;
  server_name shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  add_header Content-Type text/plain;
  return 200 "ShatteredArchive edge (HTTPS) is running.\n";
}