# Serves the shatteredarchive.dev landing page + privacy notice as static files — mirroring
# how PRODUCTION serves them (DSL/nginx/shattered_archive.site's apex `server_name
# shatteredarchive.dev` block). There, a SEPARATE host-level nginx serves them directly from
# /var/www/shatteredarchive-dev and the request never transits the Docker edge at all — see
# includes/security-headers-ads.conf's own header for that split. This dev-replica has no
# second nginx layer in front of the Docker edge, so the edge serves them itself instead; the
# ROUTING below is a deliberate mirror of that production block, adapted to run inside it.
#
# Include inside BOTH the HTTP (edge-subdomains.conf) and HTTPS (tls-dev.conf) root-domain
# `server { server_name shatteredarchive.dev; }` blocks, alongside
# includes/security-headers-ads.conf — this page carries one AdSense unit and a GA4 tag, same
# as scrum-poker, and that file's own header explains why the ad/analytics CSP profile is safe
# here (no accounts, no session cookie, this host never calls auth-server).
#
# The five files below (favicon.ico, index.html, privacy.html, site.js, sitemap.xml) are
# bind-mounted INDIVIDUALLY in each compose file's nginx service — not the whole deploy/
# folder as root, which would also expose nginx configs and docker-compose.yml itself
# over HTTP.

root /var/www/shatteredarchive-dev;
index index.html;

gzip on;
gzip_disable "msie6";
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

# ---- ads.txt (IAB authorised sellers) ----
# Served inline rather than as a file: a deleted/unsynced file would 404, and an ads.txt that
# 404s is treated the same as one that does not exist — the config IS the artifact. Same
# reasoning, and the same real publisher id, as the production block this mirrors.
location = /ads.txt {
  default_type text/plain;
  return 200 'google.com, pub-1852178360854840, DIRECT, f08c47fec0942fa0
';
}

# ---- robots.txt ----
# The one crawlable host in the .dev constellation, matching production — every other
# *.shatteredarchive.dev host gets includes/robots-disallow-all.conf instead. Served inline
# for the same reason as ads.txt, plus one specific to this location: the catch-all below ends
# in `/index.html`, so a MISSING robots.txt file would silently return the landing page's HTML
# with a 200 instead of 404 — a crawler handed HTML where robots.txt belongs concludes the
# site has no rules at all.
location = /robots.txt {
  default_type text/plain;
  return 200 'User-agent: Mediapartners-Google
Allow: /

User-agent: *
Allow: /

Sitemap: https://shatteredarchive.dev/sitemap.xml
';
}

# ---- sitemap.xml ----
# A real file, unlike the two above: it is XML with its own quoting/structure, not a one-line
# return. The explicit `=404` matters for the same reason robots.txt is inlined — without it, a
# missing sitemap.xml would return the landing page's HTML under an .xml URL, which Search
# Console reports as an unparseable sitemap rather than "never deployed".
location = /sitemap.xml {
  try_files /sitemap.xml =404;
}

# ---- Extensionless /privacy ----
# An exact match, resolved before `location /` regardless of ordering. Required, not cosmetic:
# without it, a request for /privacy falls through the catch-all's `/index.html` fallback and
# silently serves the LANDING PAGE under the /privacy URL — a privacy notice that quietly
# renders as the homepage is worse than a 404: links to it look fine and lead nowhere.
location = /privacy {
  try_files /privacy.html =404;
}

location / {
  try_files $uri $uri/ /index.html;
}

location ~ /\. {
  deny all;
}
