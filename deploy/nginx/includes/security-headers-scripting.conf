# RELAXED Content-Security-Policy profile, for a browser-facing host whose PURPOSE is to run
# user-authored code in the page. Currently game-client.shatteredarchive.dev only — no other
# app in this repo calls the Function constructor or bundles an interpreter.
#
# Include once per `server { }`, INSTEAD of security-headers.conf — never both, or nginx emits
# two CSP headers and the browser enforces the intersection, putting 'unsafe-eval' straight
# back out of reach. The non-CSP headers come from the shared file below.
include /etc/nginx/includes/security-headers-common.conf;

# Identical to the strict profile except for script-src and worker-src:
#
#  'unsafe-eval'  — not optional for the game client, for three independent reasons:
#                     1. fengari-web (Lua) evaluates `Function("return ()=>void 0;")` at
#                        module scope, unguarded, and luaRuntime.ts imports it statically —
#                        under the strict policy that throws an uncaught EvalError before
#                        React ever mounts, so the whole app fails to boot, not just Lua.
#                     2. skulpt (Python) builds callables with the Function constructor.
#                     3. the user-script sandbox compiles user JS/TS with `new Function`
#                        (features/userScripts/runtime.ts, globalRuntime.ts) — that IS the
#                        feature, so no bundler or library swap removes this requirement.
#                   CSP cannot meaningfully contain arbitrary code the user asked to run.
#                   What still earns its keep here is the REST of the policy, kept intact:
#                   no inline <script> (an injected tag is still inert), and connect-src /
#                   form-action / base-uri unchanged, so neither injected nor user script can
#                   exfiltrate to an arbitrary origin or re-point the app.
#  worker-src     — the optional advanced speech-to-text engine (@huggingface/transformers →
#                   onnxruntime-web) starts its threaded WASM backend in a blob: worker.
#                   blob: workers inherit this document's CSP, so this grants no new reach.
#
# connect-src names https://shatteredarchive.com because that is the C# site service
# (Server.Web.Public) this client calls for account cloud-sync and the /contribute/*
# endpoints — its own backend, not a third party. Without it those fetches fail as a bare
# "Failed to fetch" (a CSP refusal has no status code and never reaches the server log).
# The dev-machine variant, security-headers-scripting-dev.conf, swaps it for
# http://localhost:5000; the two files must stay identical apart from that one origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://auth.shatteredarchive.dev https://shatteredarchive.com wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
