# Baseline security headers shared by EVERY browser-facing server block.
#
# Deliberately does NOT set Content-Security-Policy: the CSP differs per profile, and nginx
# APPENDS add_header rather than replacing it — two CSP headers means the browser enforces
# their INTERSECTION, so a "relaxed" profile stacked on the strict one relaxes nothing.
# Include exactly ONE profile file per server block; each one pulls this file in itself:
#
#   security-headers.conf            — strict. The default for every SPA.
#   security-headers-scripting.conf  — adds 'unsafe-eval'. game-client only, and only
#                                      because running user-authored code IS its feature.
#   security-headers-api.conf        — default-src 'none' for API-only hosts. Standalone;
#                                      does not include this file.
#
# ---------------------------------------------------------------------------------------
# nginx gotcha, do not skip: `add_header` does NOT merge across levels. A `location` that
# declares ANY add_header of its own silently discards every add_header inherited from the
# enclosing server block — so a location adding, say, a Cache-Control or CORS header loses
# all of these too. Such locations must include their profile file AGAIN. Grep for
# `add_header` inside locations before assuming coverage.
# ---------------------------------------------------------------------------------------

# MIME sniffing turns a user-uploaded .txt into an executable .html in older browsers.
add_header X-Content-Type-Options nosniff always;

# Cross-origin referrers leak path + query (which can carry tokens) to third parties.
# strict-origin-when-cross-origin sends the full URL same-origin, bare origin cross-origin,
# and nothing at all on a downgrade — strictly better than no-referrer-when-downgrade, which
# sends the FULL url cross-origin.
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Legacy companion to the CSP frame-ancestors directive each profile sets, for browsers that
# predate it. DENY rather than SAMEORIGIN: none of these apps frame each other, so there is
# nothing to allow.
add_header X-Frame-Options DENY always;
