# Baseline security headers for API-ONLY server blocks — hosts that serve JSON/websockets and
# never HTML a browser will render as a document.
#
# Same shape as security-headers.conf, but the CSP is `default-src 'none'`: with no document
# to protect there is nothing legitimate to load, so the policy that costs nothing here is the
# strictest one. It matters for the case where a JSON endpoint is coaxed into rendering as
# HTML — the policy then permits nothing at all.
#
# The same nginx `add_header` inheritance trap applies: a location declaring its own
# add_header discards these. See security-headers.conf for the full note.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
