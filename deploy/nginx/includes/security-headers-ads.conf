# THIRD-PARTY MONETISATION Content-Security-Policy profile — Google AdSense + GA4 only.
#
# Include once per `server { }`, INSTEAD of security-headers.conf (never alongside it: nginx
# appends add_header rather than replacing, so two CSP headers means the browser enforces the
# INTERSECTION and the loosened directives below would buy nothing).
#
# ---------------------------------------------------------------------------------------
# READ THIS BEFORE ADDING THE INCLUDE TO ANOTHER SERVER BLOCK.
#
# This profile is security-headers.conf with the Google ad/analytics origins allowlisted across
# script/frame/img/connect — and NOTHING ELSE. In particular:
#
#   *** script-src does NOT contain 'unsafe-inline'. Do not add it. ***
#
# That was the original shape of this file and it was the wrong trade. 'unsafe-inline' does not
# create an XSS by itself; it removes the mitigation that would neuter one. The participant
# secret and host token moved to HttpOnly cookies on 2026-08-05 specifically so a script running
# on this origin can no longer read either one (see the server's http/cookies.ts) — but that is
# a floor, not a reason to relax the ceiling: an XSS neutered by CSP still can't cast a vote as
# someone else over the open websocket, deface the room, or exfiltrate whatever else IS
# script-readable. Giving up script-injection defence for ad revenue is still not a bargain
# worth making on a host with a live, unauthenticated websocket sitting open on every tab.
#
# It also turned out not to be necessary. The AdSense loader is fetched from an allowlisted HOST
# (pagead2.googlesyndication.com), which is a host-source match and not an inline one; the
# creatives render inside CROSS-ORIGIN iframes, and a parent's script-src does not apply inside
# them — those are governed by frame-src, which names exactly the Google origins below. Our own
# initialisation code lives in an external same-origin file for the same reason (the app's
# AdSlot.tsx and analytics.ts are bundled modules; the landing page's equivalent is deploy/site.js).
#
# IF AN AD UNIT COMES UP BLANK with a script-src violation in the console after a deploy, the
# fix is a nonce plus 'strict-dynamic', NOT blanket 'unsafe-inline'. 'strict-dynamic' lets a
# trusted script create further scripts programmatically, which is exactly what Google's loader
# does, without opening the door to injected inline markup. Be aware it causes host-source
# expressions to be IGNORED, so that change means reworking this whole policy rather than adding
# a token to it — and it needs a per-response nonce, which for these static/proxied responses
# means nginx $request_id plus sub_filter.
#
# WHY SCRUM-POKER IS STILL THE ONLY HOST ON THIS PROFILE. Even without 'unsafe-inline', this
# profile admits third-party script and third-party frames, which the strict profile does not:
#
#   - No accounts, no login form, no password field, and NO sa_session cookie. That cookie is
#     set host-only (no Domain= attribute, see auth-server's session-guard.ts) and HttpOnly,
#     so it is neither sent to nor readable from this origin.
#   - No service key, and it never calls auth-server at all.
#
# Do NOT include this on auth.shatteredarchive.dev under any circumstances — that host serves
# the login, signup and password-reset forms and sets the session cookie. Do not include it on
# game-client either: that block already runs security-headers-scripting.conf with
# 'unsafe-eval', and eval plus third-party script origins stacked on one host is a materially
# different risk from either alone.
#
# The landing page (shatteredarchive.dev) carries the same two tags but does NOT use this
# file: it is a static file served by the FRONT proxy from /var/www/shatteredarchive-dev and
# never transits this edge. It declares an equivalent policy via a <meta http-equiv> tag in
# deploy/index.html — keep the two in step.
# ---------------------------------------------------------------------------------------
include /etc/nginx/includes/security-headers-common.conf;

# Origin allowlist, and what each one is for. Trimming any of these surfaces as a silently
# blank ad unit plus a console CSP violation, never as an error the app can catch:
#
#   pagead2.googlesyndication.com    the adsbygoogle.js loader (AdSlot.tsx injects it)
#   tpc.googlesyndication.com        creative rendering + the SafeFrame container
#   googleads.g.doubleclick.net      ad serving and click-through
#   partner.googleadservices.com     loader redirect target for some publisher accounts
#   ep1/ep2.adtrafficquality.google  invalid-traffic signals; ep2 is FRAMED, so it needs
#                                    frame-src as well as connect-src
#   www.google.com                   framed for interstitial "why this ad" surfaces
#   www.googletagmanager.com         the gtag.js loader (analytics.ts injects it)
#   *.google-analytics.com,          GA4 measurement beacons. Wildcards because GA4 shards
#   *.analytics.google.com           regionally (region1.google-analytics.com and friends).
#   fundingchoicesmessages.google.com  the EU/US consent message configured under AdSense's
#                                    Privacy & messaging. It is delivered BY the AdSense tag
#                                    rather than by separate code, but it loads its own script
#                                    and renders in a frame, so it needs script/frame/connect
#                                    entries of its own or the message silently never appears —
#                                    which in the EEA means ads get limited rather than served.
#
# DELIBERATELY REMOVED relative to the strict profile:
#   connect-src https://auth.shatteredarchive.dev  — the strict profile allows this because
#     most apps use the hub for device credentials and SSO. scrum-poker does not: it holds no
#     service key and never calls auth-server (see its service comment in docker-compose.yml).
#     Leaving it in would let an injected script on THIS host — the one host that now permits
#     inline script — reach the hub cross-origin, and because the two are same-SITE the
#     SameSite=Lax session cookie WOULD ride along on such a request. auth-server's CORS
#     allowlist would stop the response being read, but there is no reason to leave the
#     request reachable at all on the one host with weakened script defence.
#
# KEPT UNCHANGED, deliberately:
#   default-src 'self'      nothing inherits the ad origins; each directive opts in by name.
#   style-src 'unsafe-inline'  same React `style=` reason as the strict profile.
#   frame-ancestors 'none'  this app is still never embedded. Ads are frames INSIDE the page
#                           (frame-src) — the opposite direction, and unrelated.
#   base-uri 'self' / form-action 'self' / object-src 'none'
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://partner.googleadservices.com https://www.googletagmanager.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://www.google.com https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data:; connect-src 'self' wss://$host https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://fundingchoicesmessages.google.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://ep2.adtrafficquality.google https://www.google.com https://fundingchoicesmessages.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# ------------------------------------------------------------------
# Ad-specific hardening beyond the CSP. Only this profile carries these, because only this
# profile hosts third-party frames — the other profiles have nothing to constrain. Kept in
# step with the shatteredarchive.dev apex block in DSL/nginx/shattered_archive.site, which
# declares the same two headers for the landing page.
# ------------------------------------------------------------------

# The last four entries are the point of this header here. browsing-topics,
# join-ad-interest-group, run-ad-auction and attribution-reporting are the Privacy Sandbox
# advertising APIs; left at their defaults an embedded ad frame could read from and contribute
# to a cross-site interest profile for the visitor. Denying them is a deliberate
# revenue-for-privacy trade — AdSense falls back to contextual targeting — and it is what keeps
# "one small ad unit" from quietly becoming cross-site behavioural tracking. A Permissions-Policy
# denial applies to embedded frames as well as the top document, which is what makes it effective
# against the creative rather than only against our own code.
#
# The device capabilities are denied because an estimation tool needs none of them, and the
# denial reaches the ad frame too.
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), browsing-topics=(), join-ad-interest-group=(), run-ad-auction=(), attribution-reporting=()" always;

# same-origin-allow-popups rather than same-origin: it denies a cross-origin opener any
# window.opener handle on this page, while still letting an ad click-through open a tab that
# keeps its opener, which full same-origin would break.
#
# Cross-Origin-Embedder-Policy is deliberately NOT set — require-corp would demand CORP headers
# from Google's ad and analytics endpoints, which they do not send, and would break both tags.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
