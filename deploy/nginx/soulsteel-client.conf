server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets are content-addressed — a missing file means a stale client (an old
  # cached index.html from before the last deploy) is asking for a bundle that no longer
  # exists. Without this, the SPA fallback below hands it back index.html as text/html, and a
  # <script type="module"> then refuses to execute with no visible error — the app silently
  # never boots. A real 404 here lets the browser fail loudly instead.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Must always be revalidated: this is what points at the current asset hashes, and caching
  # it is what causes the stale-bundle problem above in the first place.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback. Load-bearing here, unlike the other client images: room URLs are real paths
  # (/room/<uuid>) meant to be bookmarked and opened cold, so a direct hit on one must serve
  # index.html rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
