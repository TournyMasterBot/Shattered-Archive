# ============================================================
# SHATTERED-MAPS (the Mapper, dev stack only for now) — maps.shatteredarchive.dev
#
# Mounted by deploy/docker-compose.shattered-archive-experimental.yml as its own nginx template
# (/etc/nginx/templates/maps.conf.template), NOT added to edge-subdomains.conf: that file is also mounted by the production compose,
# and publishing the map editor to production is a separate decision of the owner (docs/shattered-maps/app.md).
#
# The editor keeps its work in the browser, so there is nothing to protect on the server; access is still limited to loopback and
# private networks, like the other dev-only hosts, so a forwarded port never answers the internet.
# ============================================================
server {
  # BROTLI-MITIGATION CVE-2026-111497: refuse brotli request bodies (nginx forwards them undecoded to Node).
  if ($http_content_encoding ~* "(^|[ ,])br($|[ ,;])") { return 415; }
  listen 80;
  server_name maps.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers.conf;
  include /etc/nginx/includes/robots-disallow-all.conf;

  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  location / {
    limit_except GET HEAD { deny all; }
    resolver 127.0.0.11 valid=30s;
    set $maps_client shattered-maps-client:80;
    proxy_pass http://$maps_client;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

server {
  if ($http_content_encoding ~* "(^|[ ,])br($|[ ,;])") { return 415; }
  listen 443 ssl;
  server_name maps.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers.conf;
  include /etc/nginx/includes/robots-disallow-all.conf;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  location / {
    limit_except GET HEAD { deny all; }
    resolver 127.0.0.11 valid=30s;
    set $maps_client shattered-maps-client:80;
    proxy_pass http://$maps_client;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
