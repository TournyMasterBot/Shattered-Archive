# Basic SSL params for local dev (self-signed).
# If you later switch to Let's Encrypt, these remain fine.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling doesn't apply to self-signed certs, so keep off.
ssl_stapling off;
ssl_stapling_verify off;

# Security headers (safe defaults for local dev)
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy no-referrer-when-downgrade always;
