server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The Mapper is a single-page app with a hash router, so every route is "/" with a fragment; the fallback only keeps a stray
  # path (a bookmark, a refresh on a path someone typed) from answering 404 instead of the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
