# ============================================================
# COPILOT (LOCAL-ONLY) — copilot.shatteredarchive.dev
#
# Mounted ONLY by deploy/docker-compose.shattered-archive-experimental.yml, as its own nginx template
# (/etc/nginx/templates/copilot.conf.template). It is deliberately NOT part of edge-subdomains.conf: that file is
# mounted by the production compose too, and nothing about Copilot may reach production
# (docs/standards/edge-cases/local-only-features.md, LOCAL-02; scripts/check-local-only.mjs reads every other nginx file and
# fails if it mentions Copilot). The map/`$connection_upgrade` helpers of edge-subdomains.conf are not needed here.
#
# The API is for the owner's browser on the dev stack. Access is limited to loopback and private networks as well, so a port
# that is ever forwarded by mistake still answers nobody on the internet. The app itself also checks the Origin header.
# ============================================================
server {
  # BROTLI-MITIGATION CVE-2026-111497: refuse brotli request bodies (nginx forwards them undecoded to Node).
  if ($http_content_encoding ~* "(^|[ ,])br($|[ ,;])") { return 415; }
  listen 80;
  server_name copilot.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers-api.conf;
  include /etc/nginx/includes/robots-disallow-all.conf;

  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  client_max_body_size 64k;

  location / {
    limit_except GET POST OPTIONS { deny all; }
    resolver 127.0.0.11 valid=30s;
    set $copilot_server copilot-server:65100;
    proxy_pass http://$copilot_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

server {
  if ($http_content_encoding ~* "(^|[ ,])br($|[ ,;])") { return 415; }
  listen 443 ssl;
  server_name copilot.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers-api.conf;
  include /etc/nginx/includes/robots-disallow-all.conf;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  client_max_body_size 64k;

  location / {
    limit_except GET POST OPTIONS { deny all; }
    resolver 127.0.0.11 valid=30s;
    set $copilot_server copilot-server:65100;
    proxy_pass http://$copilot_server;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
