# ============================================================
# SIMULACRUM ADMIN (LOCAL-ONLY) — simulacrum-admin.shatteredarchive.dev
#
# Mounted ONLY by deploy/docker-compose.shattered-archive-experimental.yml, as its own nginx template
# (/etc/nginx/templates/simulacrum-admin.conf.template). It is deliberately NOT part of edge-subdomains.conf: that file is
# mounted by the production compose too, and nothing about Simulacrum Admin may reach production
# (docs/standards/edge-cases/local-only-features.md; scripts/check-local-only.mjs reads every other nginx file and fails if it
# mentions this feature).
#
# What it is for: the Simulacrum Admin window in the owner's game client reads the area and room list from MUD Builder to
# offer teleport destinations (docs/game/simulacrum-admin.md, "World data"). MUD Builder itself is NOT exposed to the browser
# by this file beyond three read-only GET routes:
#
#     GET /api/areas                 the area files
#     GET /api/map                   areas with vnum ranges and room counts
#     GET /api/map/<file>.are        one area's rooms
#
# Every other path answers 404, every other method 403. Nothing here reaches a write route, the audit log, the live-state or
# reload endpoints, or an area file download. Access is limited to loopback and private networks as well, so a port that is
# ever forwarded by mistake still answers nobody on the internet.
#
# CORS: the game client runs on another origin (game-client.shatteredarchive.dev), so the allowed origins are listed below and
# nothing else is echoed. The CORS headers are set at SERVER level with `always`: an add_header inside a location would switch
# off every inherited header, and the 404 and 403 answers must carry them too, or the browser reports a CORS failure instead of
# the real status.
# ============================================================
map $http_origin $sa_admin_cors_origin {
  default "";
  "https://game-client.shatteredarchive.dev" $http_origin;
  "http://game-client.shatteredarchive.dev"  $http_origin;
  "http://localhost:30080"                   $http_origin;
}

server {
  # BROTLI-MITIGATION CVE-2026-111497: refuse brotli request bodies (nginx forwards them undecoded to Node).
  if ($http_content_encoding ~* "(^|[ ,])br($|[ ,;])") { return 415; }
  listen 80;
  server_name simulacrum-admin.shatteredarchive.dev;
  include /etc/nginx/includes/security-headers-api.conf;
  include /etc/nginx/includes/robots-disallow-all.conf;
  add_header Access-Control-Allow-Origin $sa_admin_cors_origin always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  add_header Access-Control-Max-Age 600 always;
  add_header Vary Origin always;

  allow 127.0.0.1;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;

  client_max_body_size 1k;

  # A preflight never reaches MUD Builder.
  if ($request_method = OPTIONS) { return 204; }

  location = /api/areas {
    limit_except GET OPTIONS { deny all; }
    resolver 127.0.0.11 valid=30s;
    set $mud_builder mud-builder-server:61000;
    proxy_pass http://$mud_builder;
    proxy_http_version 1.1;
    # MUD Builder sets its own CORS headers; two Access-Control-Allow-Origin values make the browser refuse the answer, so only
    # this vhost's (server level) are sent.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Vary;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /api/map {
    limit_except GET OPTIONS { deny all; }
    resolver 127.0.0.11 valid=30s;
    set $mud_builder mud-builder-server:61000;
    proxy_pass http://$mud_builder;
    proxy_http_version 1.1;
    # MUD Builder sets its own CORS headers; two Access-Control-Allow-Origin values make the browser refuse the answer, so only
    # this vhost's (server level) are sent.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Vary;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The file name pattern is the area store's own (apps/mud-builder-server/src/area-store.ts AREA_FILE_RE).
  location ~ ^/api/map/[A-Za-z0-9_][A-Za-z0-9_.-]*\.are$ {
    limit_except GET OPTIONS { deny all; }
    resolver 127.0.0.11 valid=30s;
    set $mud_builder mud-builder-server:61000;
    proxy_pass http://$mud_builder;
    proxy_http_version 1.1;
    # MUD Builder sets its own CORS headers; two Access-Control-Allow-Origin values make the browser refuse the answer, so only
    # this vhost's (server level) are sent.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Vary;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    return 404;
  }
}

