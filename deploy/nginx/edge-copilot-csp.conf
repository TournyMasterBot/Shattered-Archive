# COPILOT AND SIMULACRUM ADMIN (LOCAL-ONLY) override of includes/security-headers-scripting-dev.conf.
#
# Mounted by deploy/docker-compose.shattered-archive-experimental.yml OVER that file's path inside the nginx container, and
# nowhere else, so the game-client page on the dev stack may call https://copilot.shatteredarchive.dev and (Simulacrum Admin, read-only world
# data for the teleport picker) https://simulacrum-admin.shatteredarchive.dev. The shared include is not
# edited: it is also mounted by the production compose, and nothing about Copilot may reach production
# (scripts/check-local-only.mjs). The production stack never loads this file.
#
# KEEP IN STEP with includes/security-headers-scripting-dev.conf: the two files must differ on the two connect-src origins
# https://copilot.shatteredarchive.dev and https://simulacrum-admin.shatteredarchive.dev and NOTHING else. One file only: a second
# mount of the same target is not possible, so both local-only features share this override. A test in scripts/check-local-only.test.mjs compares them.
include /etc/nginx/includes/security-headers-common.conf;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://auth.shatteredarchive.dev https://copilot.shatteredarchive.dev https://simulacrum-admin.shatteredarchive.dev http://localhost:5000 wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
