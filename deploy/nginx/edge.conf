
server {
  listen 80;
  server_name
    shatteredarchive.dev
    game-client.shatteredarchive.dev
    web-client.shatteredarchive.dev
    game-server.shatteredarchive.dev
    web-server.shatteredarchive.dev;

  return 301 https://$host$request_uri;
}

server {
  # BROTLI-MITIGATION CVE-2026-111497: refuse brotli request bodies (nginx forwards them undecoded to Node). Re-enable with: node ShatteredArchive/deploy/scripts/brotli-mitigation.mjs remove <file>
  if ($http_content_encoding ~* "(^|[ ,])br($|[ ,;])") { return 415; }
  # No `http2` on any listener: CVE-2026-123007 (HTTP/2 flow control, nginx 1.9.5-1.31.8) needs one. Do not add it before the pinned nginx is 1.31.9+ / 1.30.7+.
  listen 443 ssl;
  server_name
    shatteredarchive.dev
    game-client.shatteredarchive.dev
    web-client.shatteredarchive.dev
    game-server.shatteredarchive.dev
    web-server.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  # default upstream
  set $upstream http://web-client:80;

  if ($host = game-client.shatteredarchive.dev) {
    set $upstream http://game-client:80;
  }
  if ($host = web-client.shatteredarchive.dev) {
    set $upstream http://web-client:80;
  }
  if ($host = game-server.shatteredarchive.dev) {
    set $upstream http://game-server:31000;
  }
  if ($host = web-server.shatteredarchive.dev) {
    set $upstream http://web-server:41000;
  }

  location / {
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
