
server {
  listen 80;
  server_name
    shatteredarchive.dev
    game-client.shatteredarchive.dev
    web-client.shatteredarchive.dev
    game-server.shatteredarchive.dev
    web-server.shatteredarchive.dev;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name
    shatteredarchive.dev
    game-client.shatteredarchive.dev
    web-client.shatteredarchive.dev
    game-server.shatteredarchive.dev
    web-server.shatteredarchive.dev;

  ssl_certificate     /etc/nginx/certs/shatteredarchive.dev.pem;
  ssl_certificate_key /etc/nginx/certs/shatteredarchive.dev-key.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  location / {
    proxy_pass http://web-client:40080;
    proxy_set_header Host $host;
  }

  if ($host = game-client.shatteredarchive.dev) {
    set $upstream http://game-client:30080;
  }
  if ($host = web-client.shatteredarchive.dev) {
    set $upstream http://web-client:40080;
  }
  if ($host = game-server.shatteredarchive.dev) {
    set $upstream http://game-server:31000;
  }
  if ($host = web-server.shatteredarchive.dev) {
    set $upstream http://web-server:41000;
  }

  location / {
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
