# Prod Command (use the deploy script)
# sudo /usr/local/bin/shatteredarchive-nightly-deploy.sh

name: shatteredarchive-prod

networks:
  shatteredarchive-prod:
    driver: bridge
  sa-shared:
    driver: bridge
    name: sa-shared

services:
  ############################################################
  # EDGE NGINX (HTTP/HTTPS termination)
  ############################################################
  nginx:
    image: nginx:alpine
    container_name: shatteredarchive-prod-nginx

    depends_on:
      game-client:
        condition: service_started
      web-client:
        condition: service_started
      game-server:
        condition: service_healthy
      web-server:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"
      - "5900:5900"
    
    environment:
      NGINX_TLS_INCLUDE_FILE: "tls-off.conf"

    volumes:
      - ./nginx/edge-subdomains.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    networks:
      shatteredarchive-prod:
        aliases:
          - shatteredarchive.dev
          - game-client.shatteredarchive.dev
          - web-client.shatteredarchive.dev
          - game-server.shatteredarchive.dev
          - web-server.shatteredarchive.dev
          - auth.shatteredarchive.dev
      sa-shared: {}

    restart: unless-stopped
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  ############################################################
  # CLIENTS (nginx in-container listens on 80)
  ############################################################
  game-client:
    build:
      context: ..
      dockerfile: deploy/game-client.Dockerfile
      args:
        VITE_PORT: "30080"
        VITE_GAME_API: "https://game-server.shatteredarchive.dev"
        VITE_GAME_SECURE: "true"
        VITE_WEB_API: "https://web-server.shatteredarchive.dev"
        VITE_WEB_WS: "wss://web-server.shatteredarchive.dev"
        VITE_WEB_SECURE: "true"
        VITE_ENV: "development"
    image: shatteredarchive-prod-game-client
    container_name: shatteredarchive-prod-game-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - game-client.shatteredarchive.dev

  web-client:
    build:
      context: ..
      dockerfile: deploy/web-client.Dockerfile
      args:
        VITE_WEB_API: "https://web-server.shatteredarchive.dev"
        VITE_WEB_WS: "wss://web-server.shatteredarchive.dev"
        VITE_WEB_SECURE: "true"
        VITE_ENV: "docker"
    image: shatteredarchive-prod-web-client
    container_name: shatteredarchive-prod-web-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - web-client.shatteredarchive.dev

  ############################################################
  # SERVERS (keep their real internal ports)
  ############################################################
  game-server:
    build:
      context: ..
      dockerfile: deploy/game-server.Dockerfile
    image: shatteredarchive-prod-game-server
    container_name: shatteredarchive-prod-game-server
    env_file:
      - ../apps/game-server/.env
    environment:
      NODE_ENV: production
      PORT: "31000"
      LOG_LEVEL: "info"
      DOTENV_CONFIG_QUIET: "true"
      GAME_PROXY_ALLOWLIST: "dsl-mud.org:4000,dsl-mud.org:8000"
      GAME_PROXY_ALLOW_ALL: "false"
      LOG_DATE_PARTITIONED: "true"
      LOG_RESPECT_SOH: "true"
      CORS_ORIGIN: "https://game-client.shatteredarchive.dev,https://web-client.shatteredarchive.dev"
    expose:
      - "31000"
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - game-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(31000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web-server:
    build:
      context: ..
      dockerfile: deploy/web-server.Dockerfile
    image: shatteredarchive-prod-web-server
    container_name: shatteredarchive-prod-web-server
    env_file:
      - ../apps/web-server/.env
    environment:
      NODE_ENV: production
      PORT: "41000"
      LOG_LEVEL: "info"
      CORS_ORIGIN: "https://game-client.shatteredarchive.dev,https://web-client.shatteredarchive.dev"
    expose:
      - "41000"
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - web-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(41000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ############################################################
  # AUTH SERVER (auth.shatteredarchive.dev) — additive, like mud-builder:
  # nothing in Phase 1 requires it to be up (no consumer calls /api/introspect
  # until Phase 2), so it must never block the rest of the stack from
  # starting. NOT in nginx's depends_on: for that reason.
  ############################################################
  auth-server:
    build:
      context: ..
      dockerfile: deploy/auth-server.Dockerfile
    image: shatteredarchive-prod-auth-server
    container_name: shatteredarchive-prod-auth-server
    restart: unless-stopped
    volumes:
      - auth-server-data:/repo/apps/auth-server/data
      - auth-server-secrets:/repo/apps/auth-server/secrets
    environment:
      NODE_ENV: production
      PORT: "62000"
      LOG_LEVEL: "info"
      DATA_DIR: "/repo/apps/auth-server/data"
      # Mounted-file secret (auth-server-secrets, above) — self-generated on first boot,
      # persists across recreation. See crypto-primitives.ts's loadDataKey() precedence.
      DATA_ENCRYPTION_KEY_FILE: "/repo/apps/auth-server/secrets/encryption.key"
      PUBLIC_ORIGIN: "https://auth.shatteredarchive.dev"
    expose:
      - "62000"
    networks:
      shatteredarchive-prod:
        aliases:
          - auth-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(62000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ############################################################
  # AUTH CLIENT (auth.shatteredarchive.dev, / split) — additive, like
  # auth-server: no expose/ports, nginx reaches it by container name.
  ############################################################
  auth-client:
    build:
      context: ..
      dockerfile: deploy/auth-client.Dockerfile
    image: shatteredarchive-prod-auth-client
    container_name: shatteredarchive-prod-auth-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - auth-client.shatteredarchive.dev

volumes:
  auth-server-data:
  auth-server-secrets: