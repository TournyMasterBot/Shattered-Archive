# Prod Command (use the deploy script)
# sudo /usr/local/bin/shatteredarchive-nightly-deploy.sh

name: shatteredarchive-prod

networks:
  shatteredarchive-prod:
    driver: bridge
  sa-shared:
    driver: bridge
    name: sa-shared

services:
  ############################################################
  # EDGE NGINX (HTTP/HTTPS termination)
  ############################################################
  nginx:
    image: nginx:alpine
    container_name: shatteredarchive-prod-nginx

    depends_on:
      game-client:
        condition: service_started
      web-client:
        condition: service_started
      game-server:
        condition: service_healthy
      web-server:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"
      - "5900:5900"
    
    environment:
      NGINX_TLS_INCLUDE_FILE: "tls-off.conf"
      # The FRONT proxy (DSL/nginx/shattered_archive.site) that terminates TLS and forwards
      # here. Consumed by edge-subdomains.conf's set_real_ip_from, which is what keeps the
      # per-IP limit_req/limit_conn zones keyed on the real client instead of collapsing
      # into global limits. Must stay a /32 of the proxy itself — see the long note there.
      FRONT_PROXY_CIDR: "${FRONT_PROXY_CIDR:-144.217.6.225/32}"

    volumes:
      - ./nginx/edge-subdomains.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    networks:
      shatteredarchive-prod:
        aliases:
          - shatteredarchive.dev
          - game-client.shatteredarchive.dev
          - web-client.shatteredarchive.dev
          - game-server.shatteredarchive.dev
          - web-server.shatteredarchive.dev
          - auth.shatteredarchive.dev
          - scrum-poker.shatteredarchive.dev
      sa-shared: {}

    restart: unless-stopped
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  ############################################################
  # CLIENTS (nginx in-container listens on 80)
  ############################################################
  game-client:
    build:
      context: ..
      dockerfile: deploy/game-client.Dockerfile
      args:
        VITE_PORT: "30080"
        VITE_GAME_API: "https://game-server.shatteredarchive.dev"
        VITE_GAME_SECURE: "true"
        VITE_WEB_API: "https://web-server.shatteredarchive.dev"
        VITE_WEB_WS: "wss://web-server.shatteredarchive.dev"
        VITE_WEB_SECURE: "true"
        VITE_ENV: "development"
    image: shatteredarchive-prod-game-client
    container_name: shatteredarchive-prod-game-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - game-client.shatteredarchive.dev

  web-client:
    build:
      context: ..
      dockerfile: deploy/web-client.Dockerfile
      args:
        VITE_WEB_API: "https://web-server.shatteredarchive.dev"
        VITE_WEB_WS: "wss://web-server.shatteredarchive.dev"
        VITE_WEB_SECURE: "true"
        VITE_ENV: "docker"
    image: shatteredarchive-prod-web-client
    container_name: shatteredarchive-prod-web-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - web-client.shatteredarchive.dev

  ############################################################
  # SERVERS (keep their real internal ports)
  ############################################################
  game-server:
    build:
      context: ..
      dockerfile: deploy/game-server.Dockerfile
    image: shatteredarchive-prod-game-server
    container_name: shatteredarchive-prod-game-server
    env_file:
      - ../apps/game-server/.env
    environment:
      NODE_ENV: production
      PORT: "31000"
      LOG_LEVEL: "info"
      DOTENV_CONFIG_QUIET: "true"
      GAME_PROXY_ALLOWLIST: "dsl-mud.org:4000,dsl-mud.org:8000"
      GAME_PROXY_ALLOW_ALL: "false"
      LOG_DATE_PARTITIONED: "true"
      LOG_RESPECT_SOH: "true"
      CORS_ORIGIN: "https://game-client.shatteredarchive.dev,https://web-client.shatteredarchive.dev"
    expose:
      - "31000"
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - game-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(31000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web-server:
    build:
      context: ..
      dockerfile: deploy/web-server.Dockerfile
    image: shatteredarchive-prod-web-server
    container_name: shatteredarchive-prod-web-server
    env_file:
      - ../apps/web-server/.env
    environment:
      NODE_ENV: production
      PORT: "41000"
      LOG_LEVEL: "info"
      CORS_ORIGIN: "https://game-client.shatteredarchive.dev,https://web-client.shatteredarchive.dev"
    expose:
      - "41000"
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - web-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(41000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ############################################################
  # AUTH SERVER (auth.shatteredarchive.dev) — additive, like mud-builder:
  # nothing in Phase 1 requires it to be up (no consumer calls /api/introspect
  # until Phase 2), so it must never block the rest of the stack from
  # starting. NOT in nginx's depends_on: for that reason.
  ############################################################
  auth-server:
    build:
      context: ..
      dockerfile: deploy/auth-server.Dockerfile
    image: shatteredarchive-prod-auth-server
    container_name: shatteredarchive-prod-auth-server
    restart: unless-stopped
    volumes:
      # Bind-mounted (not a named volume) on purpose: dsl-questions.json in here is a
      # deliberately-plain, operator-hand-edited file (see questions-store.ts) — it needs
      # a real host path to edit with a text editor. auth-server-secrets stays a named
      # volume: the encryption key must NOT be casually host-editable/visible.
      - ../apps/auth-server/data:/repo/apps/auth-server/data
      - auth-server-secrets:/repo/apps/auth-server/secrets
    environment:
      NODE_ENV: production
      PORT: "62000"
      LOG_LEVEL: "info"
      DATA_DIR: "/repo/apps/auth-server/data"
      # Mounted-file secret (auth-server-secrets, above) — self-generated on first boot,
      # persists across recreation. See crypto-primitives.ts's loadDataKey() precedence.
      DATA_ENCRYPTION_KEY_FILE: "/repo/apps/auth-server/secrets/encryption.key"
      PUBLIC_ORIGIN: "https://auth.shatteredarchive.dev"
    expose:
      - "62000"
    networks:
      shatteredarchive-prod:
        aliases:
          - auth-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(62000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ############################################################
  # AUTH CLIENT (auth.shatteredarchive.dev, / split) — additive, like
  # auth-server: no expose/ports, nginx reaches it by container name.
  ############################################################
  auth-client:
    build:
      context: ..
      dockerfile: deploy/auth-client.Dockerfile
    image: shatteredarchive-prod-auth-client
    container_name: shatteredarchive-prod-auth-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - auth-client.shatteredarchive.dev

  ############################################################
  # SCRUM POKER (scrum-poker.shatteredarchive.dev) — additive, like auth: not in nginx's
  # depends_on, so it can never block the rest of the stack from starting. Single subdomain
  # for client+server; the client calls same-origin /api/scrum and /ws/scrum.
  #
  # Deliberately NOT wired to auth-server — an accounts-free tool by design. The
  # room id (a UUID) is membership; the host token minted at creation is the only organizer notion.
  ############################################################
  scrum-poker-server:
    build:
      context: ..
      dockerfile: deploy/scrum-poker-server.Dockerfile
    image: shatteredarchive-prod-scrum-poker-server
    container_name: shatteredarchive-prod-scrum-poker-server
    restart: unless-stopped
    volumes:
      # Named volume: rooms.json is pure application data, never hand-edited on the host.
      # It survives a container recreate, so a team's room config outlives a deploy.
      - "scrum-poker-data:/repo/apps/scrum-poker-server/data"
    environment:
      NODE_ENV: production
      PORT: "63000"
      LOG_LEVEL: "info"
      DATA_DIR: "/repo/apps/scrum-poker-server/data"
      CORS_ORIGIN: "https://scrum-poker.shatteredarchive.dev"
      # An hour of inactivity drops a participant; a month drops the whole room.
      SCRUM_IDLE_TIMEOUT_MS: "3600000"
      SCRUM_ROOM_TTL_MS: "2592000000"
    expose:
      - "63000"
    networks:
      shatteredarchive-prod:
        aliases:
          - scrum-poker-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(63000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  scrum-poker-client:
    build:
      context: ..
      dockerfile: deploy/scrum-poker-client.Dockerfile
      args:
        # The app's single ad placement. Leave both empty and nothing renders — the page
        # makes no request to any ad network.
        VITE_AD_CLIENT: ""
        VITE_AD_SLOT: ""
    image: shatteredarchive-prod-scrum-poker-client
    container_name: shatteredarchive-prod-scrum-poker-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - scrum-poker-client.shatteredarchive.dev

volumes:
  auth-server-secrets:
  scrum-poker-data: