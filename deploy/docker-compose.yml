# Prod Command (use the deploy script)
# sudo /usr/local/bin/shatteredarchive-nightly-deploy.sh

name: shatteredarchive-prod

networks:
  shatteredarchive-prod:
    driver: bridge
  sa-shared:
    driver: bridge
    name: sa-shared

services:
  ############################################################
  # EDGE NGINX (HTTP/HTTPS termination)
  ############################################################
  nginx:
    image: nginx:alpine
    container_name: shatteredarchive-prod-nginx

    depends_on:
      game-client:
        condition: service_started
      web-client:
        condition: service_started
      game-server:
        condition: service_healthy
      web-server:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"
      - "5900:5900"
    
    environment:
      NGINX_TLS_INCLUDE_FILE: "tls-off.conf"
      # Production CSP profile: connect-src names the real site domain. Never the -dev
      # variant here — that one allows http://localhost:5000, which in production would mean
      # whatever the VISITOR is running on their own machine. Required — an unset value
      # leaves the literal ${...} in the rendered config and nginx refuses to start.
      NGINX_CSP_SCRIPTING_FILE: "${NGINX_CSP_SCRIPTING_FILE:-security-headers-scripting.conf}"
      # CSP profile for scrum-poker.shatteredarchive.dev — the ONLY app permitted to carry an
      # ad unit and an analytics tag. Set to the ad-permitting profile here because this stack
      # is the one that actually serves them (see the scrum-poker-client build args below); it
      # must stay in step with those, since a mismatch fails silently in one direction or the
      # other — strict profile + populated args renders a permanently blank unit with a console
      # CSP violation, and the ad profile + empty args pays 'unsafe-inline' for nothing.
      #
      # The experimental/local compose deliberately keeps the STRICT profile: ads and analytics
      # are off there. Read security-headers-ads.conf before pointing any other block at it —
      # never auth, never game-client.
      NGINX_CSP_SCRUM_FILE: "${NGINX_CSP_SCRUM_FILE:-security-headers-ads.conf}"
      # CSP profile for the shatteredarchive.dev landing page + /privacy — same mechanism and
      # same rationale as NGINX_CSP_SCRUM_FILE just above. This stack is the one that actually
      # serves the ad unit + GA4 tag (see deploy/index.html), so it defaults to the ad-permitting
      # profile here; the experimental/local compose keeps the strict one. See
      # includes/landing-page.conf and includes/security-headers-ads.conf before touching this.
      NGINX_CSP_LANDING_FILE: "${NGINX_CSP_LANDING_FILE:-security-headers-ads.conf}"
      # CSP profile for soulsteel.shatteredarchive.dev — analytics only, never ads (see
      # deploy/nginx/includes/security-headers-analytics.conf). Set to the analytics-permitting
      # profile here because this stack is the one that actually serves the GA4 tag (see the
      # soulsteel-client build args below); it must stay in step with those, same
      # fails-silently-in-one-direction risk as NGINX_CSP_SCRUM_FILE above.
      #
      # The experimental/local compose keeps the STRICT profile — analytics is off there.
      NGINX_CSP_SOULSTEEL_FILE: "${NGINX_CSP_SOULSTEEL_FILE:-security-headers-analytics.conf}"
      # The FRONT proxy (DSL/nginx/shattered_archive.site) that terminates TLS and forwards
      # here. Consumed by edge-subdomains.conf's set_real_ip_from, which is what keeps the
      # per-IP limit_req/limit_conn zones keyed on the real client instead of collapsing
      # into global limits. Must stay a /32 of the proxy itself — see the long note there.
      FRONT_PROXY_CIDR: "${FRONT_PROXY_CIDR:-144.217.6.225/32}"

    volumes:
      - ./nginx/edge-subdomains.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/certs:/etc/nginx/certs:ro

      # shatteredarchive.dev landing page + /privacy — see includes/landing-page.conf. Mounted
      # individually (not the whole deploy/ folder as root) so nginx configs and this compose
      # file itself are never exposed over HTTP.
      - ./favicon.ico:/var/www/shatteredarchive-dev/favicon.ico:ro
      - ./index.html:/var/www/shatteredarchive-dev/index.html:ro
      - ./privacy.html:/var/www/shatteredarchive-dev/privacy.html:ro
      - ./site.js:/var/www/shatteredarchive-dev/site.js:ro
      - ./sitemap.xml:/var/www/shatteredarchive-dev/sitemap.xml:ro

    networks:
      shatteredarchive-prod:
        aliases:
          - shatteredarchive.dev
          - game-client.shatteredarchive.dev
          - web-client.shatteredarchive.dev
          - game-server.shatteredarchive.dev
          - web-server.shatteredarchive.dev
          - auth.shatteredarchive.dev
          - scrum-poker.shatteredarchive.dev
          - simulacrum.shatteredarchive.dev
      sa-shared: {}

    restart: unless-stopped
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  ############################################################
  # CLIENTS (nginx in-container listens on 80)
  ############################################################
  game-client:
    build:
      context: ..
      dockerfile: deploy/game-client.Dockerfile
      args:
        VITE_PORT: "30080"
        VITE_GAME_API: "https://game-server.shatteredarchive.dev"
        VITE_GAME_SECURE: "true"
        VITE_WEB_API: "https://web-server.shatteredarchive.dev"
        VITE_WEB_WS: "wss://web-server.shatteredarchive.dev"
        VITE_WEB_SECURE: "true"
        # Explicit, even though it matches the code default: apps/game-client/.env
        # ships in the build context naming a dev value, and a real env var is
        # what overrides it.
        VITE_SITE_API: "https://shatteredarchive.com"
        VITE_ENV: "development"
    image: shatteredarchive-prod-game-client
    container_name: shatteredarchive-prod-game-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - game-client.shatteredarchive.dev

  web-client:
    build:
      context: ..
      dockerfile: deploy/web-client.Dockerfile
      args:
        VITE_WEB_API: "https://web-server.shatteredarchive.dev"
        VITE_WEB_WS: "wss://web-server.shatteredarchive.dev"
        VITE_WEB_SECURE: "true"
        VITE_ENV: "docker"
    image: shatteredarchive-prod-web-client
    container_name: shatteredarchive-prod-web-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - web-client.shatteredarchive.dev

  ############################################################
  # SERVERS (keep their real internal ports)
  ############################################################
  game-server:
    build:
      context: ..
      dockerfile: deploy/game-server.Dockerfile
    image: shatteredarchive-prod-game-server
    container_name: shatteredarchive-prod-game-server
    env_file:
      - ../apps/game-server/.env
    environment:
      NODE_ENV: production
      PORT: "31000"
      LOG_LEVEL: "info"
      DOTENV_CONFIG_QUIET: "true"
      GAME_PROXY_ALLOWLIST: "dsl-mud.org:4000,dsl-mud.org:8000,simulacrum-server.shatteredarchive.dev:65001"
      GAME_PROXY_ALLOW_ALL: "false"
      LOG_DATE_PARTITIONED: "true"
      LOG_RESPECT_SOH: "true"
      CORS_ORIGIN: "https://game-client.shatteredarchive.dev,https://web-client.shatteredarchive.dev"
    expose:
      - "31000"
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - game-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(31000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web-server:
    build:
      context: ..
      dockerfile: deploy/web-server.Dockerfile
    image: shatteredarchive-prod-web-server
    container_name: shatteredarchive-prod-web-server
    env_file:
      - ../apps/web-server/.env
    environment:
      NODE_ENV: production
      PORT: "41000"
      LOG_LEVEL: "info"
      CORS_ORIGIN: "https://game-client.shatteredarchive.dev,https://web-client.shatteredarchive.dev"
    expose:
      - "41000"
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - web-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(41000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ############################################################
  # AUTH SERVER (auth.shatteredarchive.dev) — additive, like mud-builder:
  # nothing in Phase 1 requires it to be up (no consumer calls /api/introspect
  # until Phase 2), so it must never block the rest of the stack from
  # starting. NOT in nginx's depends_on: for that reason.
  ############################################################
  auth-server:
    build:
      context: ..
      dockerfile: deploy/auth-server.Dockerfile
    image: shatteredarchive-prod-auth-server
    container_name: shatteredarchive-prod-auth-server
    restart: unless-stopped
    volumes:
      # Bind-mounted (not a named volume) on purpose: dsl-questions.json in here is a
      # deliberately-plain, operator-hand-edited file (see questions-store.ts) — it needs
      # a real host path to edit with a text editor. auth-server-secrets stays a named
      # volume: the encryption key must NOT be casually host-editable/visible.
      # HAZARD on a machine that also runs the experimental stack: this bind mount is the
      # SAME host directory that compose file uses, while the encryption key below comes
      # from a PROJECT-SCOPED volume (shatteredarchive-prod_auth-server-secrets vs
      # shatteredarchive_auth-server-secrets). Run both stacks on one host and whichever
      # starts second reads data encrypted under the other's key, fails the AES-GCM auth
      # tag and LOCKS the store ("unable to authenticate data ... store LOCKED"). Nothing
      # is lost — read() locks and throws, write() refuses while locked, so the files are
      # never rewritten — but login stays down until the intruding stack is stopped.
      # Cannot happen on a real production host, where only this stack exists.
      # deploy/scripts/deploy-auth-stack.sh refuses --prod when it detects the collision.
      - ../apps/auth-server/data:/repo/apps/auth-server/data
      - auth-server-secrets:/repo/apps/auth-server/secrets
      # Public keys published by consuming services, mounted READ-ONLY: this server only
      # ever reads them, and the consumer that owns a key is the only thing that should
      # write it. Scanned on boot and every 30s, so container start order does not matter.
      - sa-service-pubkeys:/repo/apps/auth-server/service-public-keys:ro
    environment:
      NODE_ENV: production
      PORT: "62000"
      LOG_LEVEL: "info"
      DATA_DIR: "/repo/apps/auth-server/data"
      # Mounted-file secret (auth-server-secrets, above) — self-generated on first boot,
      # persists across recreation. See crypto-primitives.ts's loadDataKey() precedence.
      DATA_ENCRYPTION_KEY_FILE: "/repo/apps/auth-server/secrets/encryption.key"
      PUBLIC_ORIGIN: "https://auth.shatteredarchive.dev"
      # origin=service — which services a device enrolled at each origin may mint tokens for,
      # mirroring nginx's own origin → upstream routing. Also derives the CORS allowlist for
      # /api/device, so the two can never drift apart.
      #
      # EMPTY ON PURPOSE, not an oversight: the two clients that use device credentials
      # (mud-builder-client, kingdom-tactics-client) exist only in the experimental compose,
      # so nothing in THIS stack needs an entry yet. Empty means deny-all, which is the
      # correct fail-closed state — auth-client is same-origin with auth-server here (nginx
      # routes /api/ on auth.shatteredarchive.dev to this service) so CORS never applies to it.
      #
      # When a client lands in this stack, add `origin=service`: comma-separated, the origin
      # lowercase, scheme+host, no path, and NO default port (a browser sends
      # https://x.dev, never https://x.dev:443); `origin=svc1|svc2` for several services.
      # Wildcards are unsupported — invalid with credentials, and reflecting arbitrary origins
      # would let any hostile page enroll itself against a signed-in account. See the
      # experimental compose for a filled-in example.
      #
      # NOTE a shatteredarchive.COM origin cannot use this path: it is cross-SITE relative to
      # the .dev hub, so the SameSite=Lax session cookie is never sent and enrollment cannot
      # authenticate. That is a cookie limit, not a CORS one — such an app needs the SSO code
      # flow instead.
      DEVICE_ORIGIN_SERVICES: ""
      # Services that additionally require an active API key on the account before a device may
      # mint for them. Empty = no service requires one. See the experimental compose.
      DEVICE_GRANT_REQUIRED_SERVICES: ""
      # ------------------------------------------------------------------
      # Declarative service registry (2026-08-01) — the source of truth for which
      # services may use SSO and which redirect URIs each may return to. Reconciled into
      # the encrypted service-key store at boot and every 30s, which is what replaced the
      # manual `register-service` + `register-redirect-uri` deployment ceremony.
      #
      # Keys are NOT listed here: each service generates its own keypair and publishes the
      # public half into sa-service-pubkeys, which this server registers automatically.
      # Nothing secret belongs in this file.
      #
      # THIS IS A FULL RECONCILE — it PRUNES. A service or redirect URI removed from here
      # is deregistered on the next pass, so the list must be EXHAUSTIVE: every service
      # that uses this hub needs an entry, or it loses access. Three refusals bound the
      # damage (see service-registry-reconciler.ts): unparseable JSON skips the whole
      # pass, an unset/empty value skips the whole pass, and a service that has published
      # no public key yet keeps its existing keys untouched rather than being revoked
      # while it boots.
      #
      # Redirect URIs are matched BYTE-FOR-BYTE by /api/sso/approve — no trailing slash,
      # no case-insensitivity, no path normalisation. They must equal exactly what the
      # consuming service sends (for shattered-web: AuthHub__RedirectUri and
      # GameSso__CallbackRedirectUri in DSL/Server/docker-compose-prod.yml).
      # ------------------------------------------------------------------
      #
      # LIVE BUG (2026-08-16): both simulacrum-server and mud-builder-server were missing
      # from this list — confirmed against the experimental stack (which shares this exact
      # gap) that an absent entry means every account-based sign-in against that service is
      # silently rejected, no matter how valid the credential is. simulacrum-server's own
      # container ships in THIS file already (see its service block); mud-builder-server's
      # does not yet (experimental-only) but is declared here regardless — an entry with no
      # published key yet is a harmless, expected no-op per the reconciler's own third
      # refusal, and pre-declaring it avoids re-discovering this exact bug the day
      # mud-builder-server IS added here for real.
      # ------------------------------------------------------------------
      SERVICE_REGISTRY: >-
        {
          "shattered-web": {
            "redirectUris": [
              "https://shatteredarchive.com/user/sso/callback",
              "https://shatteredarchive.com/user/game-sso/callback"
            ]
          },
          "simulacrum-server": {
            "redirectUris": [
              "https://simulacrum.shatteredarchive.dev/api/sso/callback"
            ]
          },
          "mud-builder-server": {
            "redirectUris": []
          }
        }
      SERVICE_PUBLIC_KEY_DIR: "/repo/apps/auth-server/service-public-keys"
    expose:
      - "62000"
    networks:
      shatteredarchive-prod:
        aliases:
          - auth-server.shatteredarchive.dev
      # ALSO on sa-shared, under the SAME alias. The C# site (DSL repo,
      # docker-compose-prod.yml — its own compose project) reaches the hub for
      # server-to-server calls (token exchange, introspect) and can only resolve
      # a name that exists on the network the two projects share. Without this
      # it has no internal route to the hub at all and would have to hairpin out
      # through the public front proxy and back.
      #
      # Direct to :62000, deliberately NOT through the edge: service-to-service
      # traffic must not be charged against the browser-sized per-IP limit_req
      # zones (auth_login/auth_api), which would otherwise see every container's
      # calls as one client. See deploy/nginx/edge-subdomains.conf's note above
      # those zones. This mirrors mud-builder-server's AUTH_SERVER_URL in the
      # experimental compose, which is the proven form of this wiring.
      sa-shared:
        aliases:
          - auth-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(62000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ############################################################
  # AUTH CLIENT (auth.shatteredarchive.dev, / split) — additive, like
  # auth-server: no expose/ports, nginx reaches it by container name.
  ############################################################
  auth-client:
    build:
      context: ..
      dockerfile: deploy/auth-client.Dockerfile
    image: shatteredarchive-prod-auth-client
    container_name: shatteredarchive-prod-auth-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - auth-client.shatteredarchive.dev

  ############################################################
  # SCRUM POKER (scrum-poker.shatteredarchive.dev) — additive, like auth: not in nginx's
  # depends_on, so it can never block the rest of the stack from starting. Single subdomain
  # for client+server; the client calls same-origin /api/scrum and /ws/scrum.
  #
  # Deliberately NOT wired to auth-server — an accounts-free tool by design. The
  # room id (a UUID) is membership; the host token minted at creation is the only organizer notion.
  ############################################################
  scrum-poker-server:
    build:
      context: ..
      dockerfile: deploy/scrum-poker-server.Dockerfile
    image: shatteredarchive-prod-scrum-poker-server
    container_name: shatteredarchive-prod-scrum-poker-server
    restart: unless-stopped
    volumes:
      # Named volume: rooms.json is pure application data, never hand-edited on the host.
      # It survives a container recreate, so a team's room config outlives a deploy.
      - "scrum-poker-data:/repo/apps/scrum-poker-server/data"
    environment:
      NODE_ENV: production
      PORT: "63000"
      LOG_LEVEL: "info"
      DATA_DIR: "/repo/apps/scrum-poker-server/data"
      CORS_ORIGIN: "https://scrum-poker.shatteredarchive.dev"
      # An hour of inactivity drops a participant; a month drops the whole room.
      SCRUM_IDLE_TIMEOUT_MS: "3600000"
      SCRUM_ROOM_TTL_MS: "2592000000"
    expose:
      - "63000"
    networks:
      shatteredarchive-prod:
        aliases:
          - scrum-poker-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(63000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  scrum-poker-client:
    build:
      context: ..
      dockerfile: deploy/scrum-poker-client.Dockerfile
      args:
        # The app's single ad placement. Leave both empty and nothing renders — the page
        # makes no request to any ad network.
        #
        # Enabling this takes THREE things, not one, and a partial job fails silently:
        #   1. both values below non-empty (either one empty = AdSlot renders nothing),
        #   2. NGINX_CSP_SCRUM_FILE=security-headers-ads.conf on the nginx service above,
        #      or the strict CSP blocks the loader and the unit stays blank,
        #   3. the publisher id present in the ads.txt served at the registrable-domain root
        #      (already there — see the `location = /ads.txt` block in the front proxy's
        #      shattered_archive.site, which covers *.shatteredarchive.dev too).
        #
        # VITE_AD_CLIENT is the publisher id in `ca-pub-…` form (note the `ca-` prefix, which
        # ads.txt does NOT carry). VITE_AD_SLOT is the ad UNIT id — a ~10-digit number from
        # the AdSense console, per placement, NOT the publisher id again.
        #
        # Neither value is a secret: the publisher id is already public in the ads.txt served
        # at the domain root, and both are readable in any visitor's page source. They are
        # env-overridable anyway so a fork or a second deployment can point at its own account.
        VITE_AD_CLIENT: "${SCRUM_AD_CLIENT:-ca-pub-1852178360854840}"
        VITE_AD_SLOT: "${SCRUM_AD_SLOT:-2791506790}"
        # GA4 measurement id. Scoped host-only at runtime rather than to the registrable domain
        # — see apps/scrum-poker-client/src/features/shared/analytics.ts for why that matters
        # with auth.shatteredarchive.dev as a sibling.
        VITE_GA_ID: "${SCRUM_GA_ID:-G-G15ZFRCGV7}"
        # VITE_SP_DEV deliberately absent: it forces the dev/experimental compose's placeholder
        # box regardless of the credentials above, and this stack is where a configured slot is
        # actually meant to serve. See deploy/scrum-poker-client.Dockerfile and AdSlot.tsx.
    image: shatteredarchive-prod-scrum-poker-client
    container_name: shatteredarchive-prod-scrum-poker-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - scrum-poker-client.shatteredarchive.dev

  ############################################################
  # SOULSTEEL (soulsteel.shatteredarchive.dev) — additive, like scrum-poker: not in nginx's
  # depends_on, so it can never block the rest of the stack from starting. Single subdomain
  # for client+server; the client calls same-origin /api/soulsteel and /health.
  #
  # Phase 1 (see .ai-plans/20260813-1911-soulsteel-herald-tool-mvp.md): the server is a
  # health-check-only skeleton — no data dir, no volume, not wired to auth-server. Game state
  # lives entirely in the browser's IndexedDB. The follow-on plan
  # (.ai-plans/20260813-1912-soulsteel-auth-archive-dashboard.md) is what adds persistence,
  # auth wiring, and a named volume — do not add those here speculatively ahead of that plan.
  ############################################################
  soulsteel-server:
    build:
      context: ..
      dockerfile: deploy/soulsteel-server.Dockerfile
    image: shatteredarchive-prod-soulsteel-server
    container_name: shatteredarchive-prod-soulsteel-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "64000"
      LOG_LEVEL: "info"
      CORS_ORIGIN: "https://soulsteel.shatteredarchive.dev"
    expose:
      - "64000"
    networks:
      shatteredarchive-prod:
        aliases:
          - soulsteel-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(64000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  soulsteel-client:
    build:
      context: ..
      dockerfile: deploy/soulsteel-client.Dockerfile
      args:
        # GA4 measurement id, no ad unit (this app carries none — see the Dockerfile). Scoped
        # host-only at runtime rather than to the registrable domain — see
        # apps/soulsteel-client/src/features/shared/analytics.ts for why that matters with
        # auth.shatteredarchive.dev as a sibling. Own dedicated GA4 property (2026-08-23),
        # separate from scrum-poker's and the landing page's — the per-hostname cookie_domain
        # pin still applies regardless, keeping `_ga` off sibling subdomains either way.
        VITE_GA_ID: "${SOULSTEEL_GA_ID:-G-SL4XD32HPC}"
    image: shatteredarchive-prod-soulsteel-client
    container_name: shatteredarchive-prod-soulsteel-client
    restart: unless-stopped
    networks:
      shatteredarchive-prod:
        aliases:
          - soulsteel-client.shatteredarchive.dev

  ############################################################
  # SIMULACRUM (simulacrum.shatteredarchive.dev) — .ai-plans/
  # 20260816-0701-simulacrum-mud-wiring.md Step 5. Same two-listener shape as the
  # experimental compose (Express 65000 + gated TCP relay 65001) — see that file
  # for the full design note.
  #
  # OPERATIONAL GAP, flagged rather than silently worked around: mud-builder-server
  # is NOT deployed to this prod compose (still experimental-only — its own front-
  # proxy block is a 503 stub). This service's role-store mount below (Constraints:
  # trusted+ tier shared between mud-builder-server and simulacrum-server) therefore
  # has nothing real to share with in PROD yet — the path is a best guess mirroring
  # this host's dev sibling-directory layout, unconfirmed, and until either
  # mud-builder-server also goes live here (letting the Roles tab grant tiers) or an
  # operator manually seeds a roles.json row at that path, simulacrum is publicly
  # reachable but NO ACCOUNT can obtain an access code — a safe failure mode (fails
  # closed to "nobody"), not a broken one, but worth knowing before wondering why a
  # trusted+ account still gets 403'd here.
  ############################################################
  simulacrum-server:
    build:
      context: ..
      dockerfile: deploy/simulacrum-server.Dockerfile
    image: shatteredarchive-prod-simulacrum-server
    container_name: shatteredarchive-prod-simulacrum-server
    restart: unless-stopped
    volumes:
      # Ed25519 private half for this service's own SSO/introspect registration — git-ignored,
      # minted via `pnpm --filter @shatteredarchive/auth-server register-service
      # simulacrum-server` run against the PROD auth-server's live data dir/key (a SEPARATE
      # registration from the experimental stack's — the two are different auth-server
      # instances with different key stores).
      - ../apps/simulacrum-server/secrets:/repo/apps/simulacrum-server/secrets:ro
      # BEST-GUESS path — see the operational-gap note above. Single-file mount (not the whole
      # auth/ directory) on purpose: this must never also expose mud-builder-server's master key.
      - ../../merc-mud/2.4/area/auth/roles.json:/repo/apps/simulacrum-server/data/roles/roles.json
      - ../../merc-mud/simulacrum-access-codes:/repo/apps/simulacrum-server/data/access-codes
      # Engine management (2026-08-23): RW mount of merc-mud's OWN area dir — hot-reload/copyover
      # signal files only (engine-reload.ts). Same "best-guess sibling path, unconfirmed" caveat
      # as the operational-gap note above applies to this mount too.
      - ../../merc-mud/2.4/area:/opt/simulacrum-engine/area
      # Read-only — engine-rebuild.ts reads docker-compose.yml + the 2.4/ build context from
      # here to trigger a rebuild of mercmud24 ONLY. The actual mutation happens through the
      # docker socket proxy below, never through this filesystem view.
      - ../../merc-mud:/host-merc-mud:ro
    environment:
      NODE_ENV: production
      PORT: "65000"
      SIMULACRUM_RELAY_PORT: "65001"
      SIMULACRUM_HOST: "simulacrum-engine"
      SIMULACRUM_PORT: "4000"
      SIMULACRUM_ACCESS_CODES_PATH: "/repo/apps/simulacrum-server/data/access-codes"
      SIMULACRUM_ROLE_STORE_PATH: "/repo/apps/simulacrum-server/data/roles"
      AUTH_SERVER_URL: "http://auth-server.shatteredarchive.dev:62000"
      AUTH_SERVER_PUBLIC_URL: "https://auth.shatteredarchive.dev"
      SIMULACRUM_PUBLIC_URL: "https://simulacrum.shatteredarchive.dev"
      SERVICE_PRIVATE_KEY_PATH: "/repo/apps/simulacrum-server/secrets/shattered-service.key"
      # Engine management (2026-08-23) — see engine-reload.ts/engine-rebuild.ts/engine-auth.ts.
      # Both flags default off — this is production's FIRST docker.sock-adjacent deployment
      # (mud-builder-server, the only other service with this pattern, was never actually
      # deployed here). Land this off, verify reload/copyover in dev first (zero docker risk),
      # then flip SIMULACRUM_ENGINE_RELOAD_ENABLED here, then only after confirming the real
      # value for MERC_MUD_HOST_PATH below (`docker inspect merc-mud2.4 --format
      # '{{json .Mounts}}'` on this host — do not trust the guessed default) flip
      # SIMULACRUM_ENGINE_REBUILD_ENABLED. Only mercmud24 is ever a build/recreate target —
      # hardcoded in engine-rebuild.ts, no request input ever reaches those docker commands.
      SIMULACRUM_ENGINE_AREA_PATH: "/opt/simulacrum-engine/area"
      MERC_MUD_REPO_PATH: "/host-merc-mud"
      MERC_MUD_HOST_PATH: "/home/ubuntu/src/merc-mud"
      SIMULACRUM_ENGINE_RELOAD_ENABLED: "false"
      SIMULACRUM_ENGINE_REBUILD_ENABLED: "false"
      # Never a raw /var/run/docker.sock bind mount here — this process talks to the daemon
      # ONLY through the verb-scoped proxy below (simulacrum-docker-proxy has EXEC=0 and every
      # swarm/secrets/services endpoint off), so a compromised simulacrum-server process can't
      # exec into or inspect secrets from any OTHER production container even though the proxy
      # can't scope by container NAME — see that service's own comment for exactly what it does
      # and doesn't close off.
      DOCKER_HOST: "tcp://simulacrum-docker-proxy:2375"
    expose:
      - "65000"
      - "65001"
    networks:
      shatteredarchive-prod:
        aliases:
          - simulacrum-server.shatteredarchive.dev
      sa-shared:
        aliases:
          - simulacrum-server

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(65000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Fronts the real /var/run/docker.sock so simulacrum-server never mounts it directly — scopes
  # by API verb/endpoint (tecnativa/docker-socket-proxy has NO container-name filtering; see
  # engine-rebuild.ts's own header comment for what actually enforces "only mercmud24"). EXEC=0
  # permanently blocks `docker exec` into ANY container via this socket — the single most
  # dangerous lateral-movement primitive on a shared socket — and every swarm/secrets/services/
  # nodes/plugins/configs/tasks/auth endpoint stays off, all irrelevant to a single-host compose
  # deployment. CONTAINERS/IMAGES/BUILD/POST/ALLOW_START/ALLOW_STOP/ALLOW_RESTARTS/NETWORKS/
  # VOLUMES are on — the minimum verified in dev to make `docker compose build`+
  # `up --force-recreate` succeed end to end (mercmud24's recreate touches its `sa-shared`
  # attachment and named volumes). Verify the SAME set against THIS proxy in dev before ever
  # flipping SIMULACRUM_ENGINE_REBUILD_ENABLED here — don't assume dev's working set transfers
  # unchanged. tecnativa/docker-socket-proxy v0.5.0
  simulacrum-docker-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: shatteredarchive-prod-simulacrum-docker-proxy
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      BUILD: "1"
      POST: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      EXEC: "0"
      SECRETS: "0"
      SERVICES: "0"
      SWARM: "0"
      NODES: "0"
      PLUGINS: "0"
      CONFIGS: "0"
      TASKS: "0"
      AUTH: "0"
      DISTRIBUTION: "0"
    networks:
      shatteredarchive-prod: {}

volumes:
  auth-server-secrets:
  scrum-poker-data:
  # Public keys published by consuming services for auto-registration. Named explicitly
  # (not project-scoped) because the C# site is a SEPARATE compose project that declares
  # it `external` — without a fixed name each project would create its own, and the two
  # would never see each other's files. Same ownership split as the sa-shared network:
  # this stack creates it, the other consumes it, so bring this one up first.
  sa-service-pubkeys:
    name: sa-service-pubkeys