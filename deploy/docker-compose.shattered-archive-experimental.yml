# docker ps --format "table {{.Names}}\t{{.Status}}"
# docker exec -it shatteredarchive-nginx sh -lc 'command -v wget || command -v curl || echo "no wget/curl"'

# This file is for experimental testing by the Shattered Archive developers
# This file should not be used for live testing
name: shatteredarchive

networks:
  shatteredarchive:
    driver: bridge

services:
  ############################################################
  # EDGE NGINX (TLS TERMINATION)
  ############################################################
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx.Dockerfile
    image: shatteredarchive-nginx
    container_name: shatteredarchive-nginx
    stdin_open: true
    tty: true

    # OPTIONAL (recommended): wait for servers to be healthy
    depends_on:
      game-client:
        condition: service_started
      web-client:
        condition: service_started
      game-server:
        condition: service_healthy
      web-server:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"
    volumes:
      # keep your template-based config flow
      - ./nginx/edge-subdomains.conf:/etc/nginx/templates/default.conf.template:ro

      # DO NOT CHANGE CERTS (as requested)
      - ./nginx/certs:/etc/nginx/certs:ro

      # nginx logs to host
      - "C:/Projects/DSL/GameLogs/ShatteredArchive/Docker/nginx:/var/log/nginx"

      # persist logrotate state inside docker
      - "nginx-logrotate-state:/var/lib/logrotate"
    networks:
      shatteredarchive:
        aliases:
          - shatteredarchive.dev
          - game-client.shatteredarchive.dev
          - web-client.shatteredarchive.dev
          - game-server.shatteredarchive.dev
          - web-server.shatteredarchive.dev

    healthcheck:
      # If wget is not available in your nginx image, replace with:
      # test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      test: ["CMD-SHELL", "wget -q --spider --max-redirect=0 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  ############################################################
  # CLIENTS
  ############################################################
  game-client:
    build:
      context: ..
      dockerfile: deploy/game-client.Dockerfile
      args:
        VITE_PORT: "30080"
        VITE_GAME_API: "https://game-server.shatteredarchive.dev"
        VITE_GAME_SECURE: "true"
        VITE_WEB_API: "https://web-server.shatteredarchive.dev"
        VITE_WEB_WS: "wss://web-server.shatteredarchive.dev"
        VITE_WEB_SECURE: "true"
        VITE_ENV: "development"
    image: shatteredarchive-game-client
    stdin_open: true
    tty: true
    networks:
      shatteredarchive:
        aliases:
          - game-client.shatteredarchive.dev

  web-client:
    build:
      context: ..
      dockerfile: deploy/web-client.Dockerfile
      args:
        VITE_WEB_API: "https://web-server.shatteredarchive.dev"
        VITE_WEB_WS: "wss://web-server.shatteredarchive.dev"
        VITE_WEB_SECURE: "true"
        VITE_ENV: "docker"
    image: shatteredarchive-web-client
    stdin_open: true
    tty: true
    networks:
      shatteredarchive:
        aliases:
          - web-client.shatteredarchive.dev

  ############################################################
  # SERVERS
  ############################################################
  game-server:
    build:
      context: ..
      dockerfile: deploy/game-server.Dockerfile
    image: shatteredarchive-game-server
    stdin_open: true
    tty: true
    volumes:
      - "C:/Projects/DSL/GameLogs/ShatteredArchive/Docker/game-server:/repo/apps/game-server/log"
    env_file:
      - ../apps/game-server/.env
    environment:
      NODE_ENV: production
      PORT: "31000"
      LOG_LEVEL: "debug"
      DOTENV_CONFIG_QUIET: "true"
      GAME_PROXY_ALLOW_ALL: "false"
      GAME_PROXY_ALLOWLIST: "dsl-mud.org:4000,dsl-mud.org:8000,localhost:4000"
      LOG_DATE_PARTITIONED: "true"
      LOG_FILE_PATH: "/repo/apps/game-server/log/server.log"
      JSON_LOG_FILE_PATH: "/repo/apps/game-server/log/server.log.jsonl"
      LOG_RESPECT_SOH: "true"
    expose:
      - "31000"
    networks:
      shatteredarchive:
        aliases:
          - game-server.shatteredarchive.dev

    healthcheck:
      # TCP port open check without curl/wget
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(31000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web-server:
    build:
      context: ..
      dockerfile: deploy/web-server.Dockerfile
    image: shatteredarchive-web-server
    stdin_open: true
    tty: true
    volumes:
      - "C:/Projects/DSL/GameLogs/ShatteredArchive/Docker/web-server:/repo/apps/web-server/log"
    env_file:
      - ../apps/web-server/.env
    environment:
      NODE_ENV: production
      PORT: "41000"
      LOG_LEVEL: "debug"
      LOG_DATE_PARTITIONED: "true"
      LOG_FILE_PATH: "/repo/apps/web-server/log/server.log"
      LOG_JSONL_ENABLED: "true"
      LOG_JSONL_PATH: "/repo/apps/web-server/log/server.log.jsonl"
    expose:
      - "41000"
    networks:
      shatteredarchive:
        aliases:
          - web-server.shatteredarchive.dev

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const s=net.connect(41000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  nginx-logrotate-state:
